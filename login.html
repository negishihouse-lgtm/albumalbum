<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Album Collection</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050505;
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    padding:40px;
    padding-left:280px;
    padding-bottom:120px;
}

.login-box{
    max-width:420px;
    margin:80px auto;
    background:#0b0b0b;
    border:1px solid rgba(255,255,255,0.12);
    border-radius:18px;
    padding:32px;
}

h1{
    font-size:36px;
    margin-bottom:24px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:14px;
    background:#111;
    color:white;
    border:1px solid rgba(255,255,255,0.2);
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    background:#6fa8dc;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

button:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

.sub-btn{
    background:#222;
}

.signup-link-btn{
    display:block;
    width:100%;
    padding:14px;
    margin-top:10px;
    background:#222;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    text-align:center;
    text-decoration:none;
}

.signup-link-btn:hover{
    background:#2a2a2a;
}

.message{
    margin-top:16px;
    color:#aaa;
    line-height:1.7;
    white-space:pre-wrap;
}

.error{
    color:#ff8a8a;
}

.success{
    color:#9ed99e;
}

a{
    color:#6fa8dc;
    text-decoration:none;
}

/* ===== 共通PCサイドバー ===== */
.sidebar{
    position:fixed;
    top:0;
    left:0;
    width:240px;
    height:100vh;
    background:#0b0b0b;
    border-right:1px solid rgba(255,255,255,0.1);
    padding:30px 20px;
    overflow-y:auto;
    z-index:100;
}

.logo{
    font-size:28px;
    font-weight:700;
    margin-bottom:30px;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:14px 16px;
    margin-bottom:8px;
    border-radius:10px;
    font-size:15px;
}

.sidebar a:hover,
.sidebar a.active{
    background:#1a1a1a;
}

.sidebar a.active{
    color:#6fa8dc;
}

/* ===== 共通スマホ下部タブバー ===== */
.mobile-tabbar{
    display:none;
}

.mobile-tabbar a{
    color:#999;
    text-decoration:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    font-size:11px;
    flex:1;
}

.mobile-tabbar a.active{
    color:#6fa8dc;
}

.mobile-tabbar .icon{
    font-size:22px;
    line-height:1;
}

/* ===== 共通右下投稿ボタン ===== */
.fab{
    position:fixed;
    right:24px;
    bottom:24px;
    width:64px;
    height:64px;
    border-radius:50%;
    background:#6fa8dc;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    text-decoration:none;
    box-shadow:0 8px 24px rgba(0,0,0,0.45);
    z-index:1000;
}

.fab:hover{
    background:#84b7e4;
}

@media(max-width:900px){
    body{
        padding-left:16px !important;
        padding-right:16px !important;
        padding-bottom:110px !important;
    }

    .sidebar{
        display:none;
    }

    .mobile-tabbar{
        display:flex;
        position:fixed;
        left:0;
        right:0;
        bottom:0;
        height:72px;
        background:#0b0b0b;
        border-top:1px solid rgba(255,255,255,0.1);
        z-index:999;
        padding-bottom:env(safe-area-inset-bottom);
    }

    .fab{
        right:16px;
        bottom:88px;
        width:58px;
        height:58px;
        font-size:32px;
    }

    .login-box{
        margin:32px auto;
        padding:26px;
    }

    h1{
        font-size:32px;
    }
}
</style>
</head>

<body>

<!-- PC用サイドバー -->
<nav class="sidebar">
    <div class="logo">Album Collection</div>

    <a href="index.html">ホーム</a>
    <a href="search.html">検索</a>
    <a href="editor.html">投稿する</a>
    <a href="notifications.html">通知</a>
    <a id="myPageLink" href="login.html">マイページ</a>
    <a href="profile-edit.html">プロフィール編集</a>
    <a href="login.html" class="active">ログイン</a>
</nav>

<!-- スマホ用下部タブバー -->
<nav class="mobile-tabbar">
    <a href="index.html">
        <div class="icon">🏠</div>
        <div>ホーム</div>
    </a>

    <a href="search.html">
        <div class="icon">🔍</div>
        <div>検索</div>
    </a>

    <a href="editor.html">
        <div class="icon">➕</div>
        <div>投稿</div>
    </a>

    <a href="notifications.html">
        <div class="icon">🔔</div>
        <div>通知</div>
    </a>

    <a id="mobileMyPageLink" href="login.html">
        <div class="icon">👤</div>
        <div>マイページ</div>
    </a>
</nav>

<a href="editor.html" class="fab">＋</a>

<div class="login-box">
    <h1>Login</h1>

    <input type="email" id="email" placeholder="メールアドレス" autocomplete="email">
    <input type="password" id="password" placeholder="パスワード" autocomplete="current-password">

    <button id="loginBtn">ログイン</button>
    <button class="sub-btn" id="logoutBtn">ログアウト</button>
    <a class="signup-link-btn" href="signup.html">新規登録はこちら</a>

    <div class="message" id="message"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
    initializeFirestore,
    doc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyBfXg4W8MLV6sL1I-g1OOv-6znxJztL1Yc",
    authDomain: "album-49b3e.firebaseapp.com",
    projectId: "album-49b3e",
    storageBucket: "album-49b3e.firebasestorage.app",
    messagingSenderId: "448724897117",
    appId: "1:448724897117:web:e124ab546bc69aeea7ecb4",
    measurementId: "G-3QFX3GDEXN"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const db = initializeFirestore(app, {
    experimentalAutoDetectLongPolling: true
});

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const message = document.getElementById("message");
const myPageLink = document.getElementById("myPageLink");
const mobileMyPageLink = document.getElementById("mobileMyPageLink");

const params = new URLSearchParams(location.search);
const redirect = params.get("redirect") || "index.html";

function setMessage(text, type = ""){
    message.textContent = text;
    message.className = "message";

    if(type){
        message.classList.add(type);
    }
}

function updateCommonMyPageLinks(user){
    const url = user ? `profile.html?uid=${encodeURIComponent(user.uid)}` : "login.html";

    myPageLink.href = url;
    mobileMyPageLink.href = url;
}

function goRedirect(){
    location.href = redirect;
}

async function updatePrivateUserData(user){
    /*
      users/{uid}
      → 本人用データ。
      → Firestore Rules側で本人だけ読めるようにする前提。
      → 公開プロフィールには使わない。
    */

    await setDoc(doc(db, "users", user.uid), {
        uid: user.uid,
        email: user.email,
        emailVerified: user.emailVerified,
        lastLoginAt: serverTimestamp(),
        updatedAt: serverTimestamp()
    }, { merge: true });
}

loginBtn.addEventListener("click", async () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if(!email || !password){
        setMessage("メールアドレスとパスワードを入力してください。", "error");
        return;
    }

    loginBtn.disabled = true;
    setMessage("ログイン中です…");

    try{
        const userCredential = await signInWithEmailAndPassword(auth, email, password);

        await updatePrivateUserData(userCredential.user);

        setMessage("ログインしました。移動します。", "success");

        setTimeout(() => {
            goRedirect();
        }, 500);

    }catch(error){
        console.error(error);

        let text = "ログインエラー：" + error.message;

        if(error.code === "auth/invalid-email"){
            text = "メールアドレスの形式が正しくありません。";
        }else if(error.code === "auth/user-not-found"){
            text = "このメールアドレスのアカウントは見つかりません。";
        }else if(error.code === "auth/wrong-password"){
            text = "パスワードが違います。";
        }else if(error.code === "auth/invalid-credential"){
            text = "メールアドレスまたはパスワードが違います。";
        }else if(error.code === "permission-denied"){
            text = "Firestoreの権限エラーです。users の更新ルールを確認してください。";
        }

        setMessage(text, "error");
        loginBtn.disabled = false;
    }
});

logoutBtn.addEventListener("click", async () => {
    logoutBtn.disabled = true;
    setMessage("ログアウト中です…");

    try{
        await signOut(auth);
        setMessage("ログアウトしました。", "success");
    }catch(error){
        console.error(error);
        setMessage("ログアウトエラー：" + error.message, "error");
    }finally{
        logoutBtn.disabled = false;
    }
});

onAuthStateChanged(auth, (user) => {
    updateCommonMyPageLinks(user);

    if(user){
        setMessage(`ログイン中：${user.email}`);
    }else{
        setMessage("ログインしていません。");
    }
});
</script>

</body>
</html>
