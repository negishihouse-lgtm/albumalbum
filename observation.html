function getUserIconUrl(data){
    return (
        data?.photoURL ||
        data?.iconURL ||
        data?.iconUrl ||
        data?.avatar ||
        data?.avatarUrl ||
        data?.profileImage ||
        data?.profileImageUrl ||
        data?.imageUrl ||
        data?.icon ||
        ""
    );
}

function getUserDisplayNameFromData(data){
    if(!data){
        return "";
    }

    return (
        data.displayName ||
        data.nickname ||
        data.nickName ||
        data.userName ||
        data.name ||
        ""
    );
}

async function getCurrentUserProfile(user){
    if(!user){
        return null;
    }

    try{
        const userSnap = await getDoc(doc(db, "publicUsers", user.uid));

        if(userSnap.exists()){
            return userSnap.data();
        }
    }catch(error){
        console.warn("自分のプロフィール取得に失敗しました", error);
    }

    return null;
}

async function getPosterProfileForAlbum(album){
    const uid = album?.userId || "";

    if(uid && userProfileCache.has(uid)){
        return userProfileCache.get(uid);
    }

    const fallbackProfile = {
        name: album?.userName || album?.displayName || album?.nickname || "匿名ユーザー",
        iconUrl: album?.userIconUrl || album?.userPhotoURL || album?.photoURL || album?.avatarUrl || ""
    };

    if(uid){
        try{
            const userSnap = await getDoc(doc(db, "publicUsers", uid));

            if(userSnap.exists()){
                const userData = userSnap.data();
                const profile = {
                    name: getUserDisplayNameFromData(userData) || fallbackProfile.name,
                    iconUrl: getUserIconUrl(userData) || fallbackProfile.iconUrl
                };

                userProfileCache.set(uid, profile);
                return profile;
            }
        }catch(error){
            console.warn("投稿者プロフィールの取得に失敗しました", error);
        }
    }

    if(uid){
        userProfileCache.set(uid, fallbackProfile);
    }

    return fallbackProfile;
}

function getInitialLetter(name){
    const text = String(name || "匿名ユーザー").trim();

    if(!text){
        return "匿";
    }

    return Array.from(text)[0];
}

function creatorAvatarHTML(profile){
    const iconUrl = profile?.iconUrl || "";
    const initialLetter = getInitialLetter(profile?.name);

    if(iconUrl){
        return `<img class="creator-avatar" src="${escapeHTML(iconUrl)}" alt="${escapeHTML(initialLetter)}">`;
    }

    return `<span class="creator-avatar-fallback">${escapeHTML(initialLetter)}</span>`;
}

async function updateMobileMyPageTab(user){
    if(!mobileMyPageLink){
        return;
    }

    if(!user){
        mobileMyPageLink.href = "login.html";

        if(mobileMyPageAvatar){
            mobileMyPageAvatar.style.display = "none";
            mobileMyPageAvatar.src = "";
        }

        if(mobileMyPageFallback){
            mobileMyPageFallback.style.display = "flex";
        }

        return;
    }

    mobileMyPageLink.href = `profile.html?uid=${encodeURIComponent(user.uid)}`;

    try{
        const userSnap = await getDoc(doc(db, "publicUsers", user.uid));

        if(!userSnap.exists()){
            return;
        }

        const iconUrl = getUserIconUrl(userSnap.data());

        if(iconUrl && mobileMyPageAvatar && mobileMyPageFallback){
            mobileMyPageAvatar.src = iconUrl;
            mobileMyPageAvatar.style.display = "block";
            mobileMyPageFallback.style.display = "none";

            mobileMyPageAvatar.onerror = () => {
                mobileMyPageAvatar.style.display = "none";
                mobileMyPageFallback.style.display = "flex";
            };
        }
    }catch(error){
        console.warn("マイページアイコンの取得に失敗しました", error);
    }
}

function escapeHTML(value){
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function getAlbumItemById(albumId){

}

function canManageAlbum(album){

}

function editAlbum(albumId){

}

async function deleteAlbumPost(albumId){
    if(!currentUser || !albumId){
        return;
    }

    const item = getAlbumItemById(albumId);
    const album = item?.data || {};

    if(album.userId !== currentUser.uid){
        alert("自分の投稿だけ削除できます");
        return;
    }

    const ok = confirm("この投稿を削除しますか？");

    if(!ok){
        return;
    }

    try{
        await deleteDoc(doc(db, "albums", albumId));
        showShareToast("投稿を削除しました");
    }catch(error){
        console.error("投稿の削除に失敗しました", error);
        alert("投稿の削除に失敗しました：" + (error?.message || error));
    }
}

function getShareUrl(targetTypeOrId, maybeTargetId){
    const targetType = maybeTargetId ? String(targetTypeOrId || "album") : "album";
    const targetId = maybeTargetId || targetTypeOrId;
    const pageName = targetType === "list" ? "list-detail.html" : "detail.html";
    const url = new URL(pageName, location.href);
    url.searchParams.set("id", targetId);
    return url.href;
}

function getShareText(targetTypeOrId, maybeTargetId){
    const targetType = maybeTargetId ? String(targetTypeOrId || "album") : "album";
    const targetId = maybeTargetId || targetTypeOrId;

    if(targetType === "list"){
        const item = getListItemById(targetId);
        const list = item?.data || {};
        const title = list.title || "Album Collectionのリスト";
        const itemCount = Number(list.itemCount || 0);
        const suffix = itemCount > 0 ? ` / ${itemCount}曲入り` : "";
        return `${title}${suffix}`;
    }

    const item = getAlbumItemById(targetId);
    const album = item?.data || {};
    const title = album.title || "Album Collectionの投稿";
    const artist = album.artist ? ` / ${album.artist}` : "";
    return `${title}${artist}`;
}

function isHttpUrl(value){
    if(!value || typeof value !== "string"){
        return false;
    }

    try{
        const url = new URL(value);
        return url.protocol === "https:" || url.protocol === "http:";
    }catch(error){
        return false;
    }
}

function normalizeSpotifyType(value){
    const type = String(value || "").toLowerCase();

    if(type === "album"){
        return "album";
    }

    if(type === "playlist"){
        return "playlist";
    }

    if(type === "artist"){
        return "artist";
    }

    return "track";
}

function getSpotifyUrlFromId(album){
    const id = album?.spotifyId || album?.spotifyTrackId || album?.spotifyAlbumId || "";

    if(!id){
        return "";
    }

    const type = normalizeSpotifyType(album?.spotifyType || album?.type);
    return `https://open.spotify.com/${type}/${encodeURIComponent(id)}`;
}

function getSpotifyUrlFromUri(album){
    const uri =
        album?.spotifyUri ||
        album?.spotifyURI ||
        album?.spotifyTrackUri ||
        album?.spotifyAlbumUri ||
        "";

    if(!uri || typeof uri !== "string"){
        return "";
    }

    const parts = uri.split(":");

    if(parts.length < 3 || parts[0] !== "spotify"){
        return "";
    }

    const type = normalizeSpotifyType(parts[1]);
    const id = parts[2];

    if(!id){
        return "";
    }

    return `https://open.spotify.com/${type}/${encodeURIComponent(id)}`;
}

function getDirectMusicUrlForAlbum(album){
    const candidates = [
        album?.spotifyUrl,
        album?.spotifyURL,
        album?.spotifyLink,
        album?.spotifyTrackUrl,
        album?.spotifyTrackURL,
        album?.spotifyAlbumUrl,
        album?.spotifyAlbumURL,
        album?.appleMusicUrl,
        album?.appleMusicURL,
        album?.youtubeMusicUrl,
        album?.youtubeMusicURL,
        album?.musicUrl,
        album?.musicURL
    ];

    const directUrl = candidates.find(isHttpUrl);

    if(directUrl){
        return directUrl;
    }

    return getSpotifyUrlFromId(album) || getSpotifyUrlFromUri(album);
}

function getSpotifySearchUrlForAlbum(album){
    const queryText = [album?.title, album?.artist]
        .filter(Boolean)
        .join(" ");

    if(!queryText){
        return "https://open.spotify.com/search";
    }

    return `https://open.spotify.com/search/${encodeURIComponent(queryText)}`;
}

const listenServiceLabels = [
    { key:"spotify", name:"Spotify", icon:"▶" },
    { key:"appleMusic", name:"Apple Music", icon:"♫" },
    { key:"lineMusic", name:"LINE MUSIC", icon:"♪" },
    { key:"youtubeMusic", name:"YouTube Music", icon:"▶" },
    { key:"amazonMusic", name:"Amazon Music", icon:"a" },
    { key:"awa", name:"AWA", icon:"A" },
    { key:"deezer", name:"Deezer", icon:"D" },
    { key:"tidal", name:"TIDAL", icon:"T" },
    { key:"soundcloud", name:"SoundCloud", icon:"☁" }
];

const priorityListenKeys = [
    "spotify",
    "appleMusic",
    "lineMusic",
    "youtubeMusic",
    "amazonMusic",
    "awa"
];

function getListenSearchQuery(album){
    return [album?.title, album?.artist]
        .filter(Boolean)
        .join(" ")
        .trim();
}

function buildServiceSearchUrl(serviceKey, queryText){
    const q = encodeURIComponent(queryText || "");

    if(!q){
        return "";
    }

    if(serviceKey === "appleMusic"){
        return `https://music.apple.com/search?term=${q}`;
    }

    if(serviceKey === "lineMusic"){
        return `https://music.line.me/webapp/search?query=${q}`;
    }

    if(serviceKey === "youtubeMusic"){
        return `https://music.youtube.com/search?q=${q}`;
    }

    if(serviceKey === "amazonMusic"){
        return `https://music.amazon.co.jp/search/${q}`;
    }

    if(serviceKey === "awa"){
        return `https://s.awa.fm/search?q=${q}`;
    }

    if(serviceKey === "spotify"){
        return `https://open.spotify.com/search/${q}`;
    }

    return "";
}

function getServiceLabelByKey(key){
    return listenServiceLabels.find(service => service.key === key) || null;
}

function createSearchFallbackServices(album, existingKeys = new Set()){
    const queryText = getListenSearchQuery(album);

    if(!queryText){
        return [];
    }

    return priorityListenKeys
        .filter(key => !existingKeys.has(key))
        .map((key) => {
            const label = getServiceLabelByKey(key);
            const url = buildServiceSearchUrl(key, queryText);

            if(!label || !url){
                return null;
            }

            return {
                key,
                name:`${label.name}で検索`,
                icon:label.icon,
                url
            };
        })
        .filter(Boolean);
}

function mergeUniqueServices(services){
    const seen = new Set();
    const result = [];

    services.forEach((service) => {
        if(!service?.url){
            return;
        }

        const uniqueKey = service.key || service.url;

        if(seen.has(uniqueKey)){
            return;
        }

        seen.add(uniqueKey);
        result.push(service);
    });

    return result;
}

function openUrlBlank(url){
    if(!url){

function loadImageForCanvas(src){
    return new Promise((resolve) => {
        if(!src){
            resolve(null);
            return;
        }

        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
    });
}

function roundRect(ctx, x, y, width, height, radius){
    const r = Math.min(radius, width / 2, height / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + width, y, x + width, y + height, r);
    ctx.arcTo(x + width, y + height, x, y + height, r);
    ctx.arcTo(x, y + height, x, y, r);
    ctx.arcTo(x, y, x + width, y, r);
    ctx.closePath();
}

function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight, maxLines){
    const chars = Array.from(String(text || ""));
    let line = "";
    let lines = [];

    for(const char of chars){
        const testLine = line + char;
        if(ctx.measureText(testLine).width > maxWidth && line){
            lines.push(line);
            line = char;
        }else{
            line = testLine;
        }
    }

    if(line){
        lines.push(line);
    }

    lines = lines.slice(0, maxLines);

    lines.forEach((lineText, index) => {
        const isLast = index === maxLines - 1 && lines.length === maxLines;
        let output = lineText;

        if(isLast && ctx.measureText(output).width > maxWidth){
            while(output.length > 0 && ctx.measureText(output + "…").width > maxWidth){
                output = output.slice(0, -1);
            }
            output += "…";
        }

        ctx.fillText(output, x, y + (index * lineHeight));
    });
}

function canvasToBlob(canvas){
    return new Promise((resolve) => {
        canvas.toBlob((blob) => resolve(blob), "image/png", 0.95);
    });
}

async function generateInstagramStoryImage(){
    if(selectedShareTargetType !== "album"){
        showShareToast("リストはリンク共有のみ対応しています");
        return;
    }

    if(!selectedShareTargetId){
        return;
    }

    const item = getAlbumItemById(selectedShareTargetId);
    if(!item){
        showShareToast("投稿データを取得できませんでした");
        return;
    }

    const album = item.data || {};
    const posterProfile = await getPosterProfileForAlbum(album);
    const canvas = document.createElement("canvas");
    canvas.width = 1080;
    canvas.height = 1920;

    const ctx = canvas.getContext("2d");

    function fillRoundRect(x, y, width, height, radius, color){
        ctx.save();
        roundRect(ctx, x, y, width, height, radius);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.restore();
    }

    function strokeRoundRect(x, y, width, height, radius, color, lineWidth = 1){
        ctx.save();
        roundRect(ctx, x, y, width, height, radius);
        ctx.strokeStyle = color;
        ctx.lineWidth = lineWidth;
        ctx.stroke();
        ctx.restore();
    }

    function splitWrappedLines(textValue, maxWidth, maxLines){
        const chars = Array.from(String(textValue || ""));
        let line = "";
        let lines = [];

        for(const char of chars){
            const testLine = line + char;
            if(ctx.measureText(testLine).width > maxWidth && line){
                lines.push(line);
                line = char;
            }else{
                line = testLine;
            }
        }

        if(line){
            lines.push(line);
        }

        if(lines.length > maxLines){
            lines = lines.slice(0, maxLines);
            let lastLine = lines[maxLines - 1];
            while(lastLine.length > 0 && ctx.measureText(lastLine + "…").width > maxWidth){
                lastLine = lastLine.slice(0, -1);
            }
            lines[maxLines - 1] = lastLine + "…";
        }

        return lines;
    }

    function drawCenteredWrappedText(textValue, centerX, topY, maxWidth, lineHeight, maxLines){
        const lines = splitWrappedLines(textValue, maxWidth, maxLines);
        lines.forEach((lineText, index) => {
            const width = ctx.measureText(lineText).width;
            ctx.fillText(lineText, centerX - (width / 2), topY + (index * lineHeight));
        });
        return lines.length;
    }

    function drawMeterRow(y, leftIcon, leftLabel, rightIcon, rightLabel, value){
        const safeValue = Math.max(1, Math.min(5, Number(value) || 3));
        const leftIconCenterX = 110;
        const leftLabelX = 144;
        const lineLeft = 272;
        const lineRight = 820;
        const rightIconCenterX = 876;
        const rightAreaRight = 980;
        const step = (lineRight - lineLeft) / 4;
        const selectedX = lineLeft + ((safeValue - 1) * step);

        ctx.save();
        ctx.fillStyle = "#f0d6a8";
        ctx.font = "700 34px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(leftIcon, leftIconCenterX, y);

        ctx.font = "700 30px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.fillText(rightIcon, rightIconCenterX, y);
        ctx.restore();

        ctx.fillStyle = "rgba(255,245,228,0.96)";
        ctx.font = "700 24px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "alphabetic";
        ctx.fillText(leftLabel, leftLabelX, y + 10);

        const rightWidth = ctx.measureText(rightLabel).width;
        ctx.fillText(rightLabel, rightAreaRight - rightWidth, y + 10);

        const lineGradient = ctx.createLinearGradient(lineLeft, y, lineRight, y);
        lineGradient.addColorStop(0, "rgba(102,136,186,0.82)");
        lineGradient.addColorStop(0.5, "rgba(205,208,215,0.74)");
        lineGradient.addColorStop(1, "rgba(246,155,107,0.90)");
        ctx.strokeStyle = lineGradient;
        ctx.lineWidth = 4;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(lineLeft, y);
        ctx.lineTo(lineRight, y);
        ctx.stroke();

        ctx.save();
        ctx.shadowColor = "rgba(255,255,255,0.42)";
        ctx.shadowBlur = 18;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(selectedX, y, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    function drawKeywordChip(textValue, x, y){
        const label = `#${String(textValue || "").replace(/^#+/, "")}`;
        ctx.font = "600 21px -apple-system, BlinkMacSystemFont, sans-serif";
        const width = Math.ceil(ctx.measureText(label).width) + 44;
        fillRoundRect(x, y, width, 54, 27, "rgba(20,22,25,0.42)");
        strokeRoundRect(x, y, width, 54, 27, "rgba(255,255,255,0.18)", 1.6);
        ctx.fillStyle = "rgba(255,255,255,0.95)";
        ctx.fillText(label, x + 22, y + 34);
        return width;
    }

    function getDisplayDescription(){
        return (
            album.desc ||
            album.description ||
            album.comment ||
            album.review ||
            "この音楽の魅力を、Album Collectionで記録しよう。"
        );
    }

    function getKeywordList(){
        return normalizeKeywords(album.keywords ?? []).filter(Boolean).slice(0, 4);
    }

    const coverImage = await loadImageForCanvas(album.cover || "");

    if(coverImage){
        try{
            ctx.save();
            ctx.filter = "blur(34px)";
            ctx.globalAlpha = 0.58;
            const scale = Math.max(canvas.width / coverImage.width, canvas.height / coverImage.height);
            const drawW = coverImage.width * scale;
            const drawH = coverImage.height * scale;
            const drawX = (canvas.width - drawW) / 2;
            const drawY = (canvas.height - drawH) / 2;
            ctx.drawImage(coverImage, drawX, drawY, drawW, drawH);
            ctx.restore();
        }catch(error){
            console.warn("背景画像の描画に失敗しました", error);
        }
    }

    const bgGradient = ctx.createLinearGradient(0, 0, 0, 1920);
    bgGradient.addColorStop(0, "rgba(40,30,18,0.16)");
    bgGradient.addColorStop(0.26, "rgba(15,18,24,0.30)");
    bgGradient.addColorStop(0.60, "rgba(9,12,17,0.60)");
    bgGradient.addColorStop(1, "rgba(5,7,10,0.92)");
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, 1080, 1920);

    const darkGradient = ctx.createLinearGradient(0, 220, 0, 1920);
    darkGradient.addColorStop(0, "rgba(255,255,255,0.00)");
    darkGradient.addColorStop(0.38, "rgba(8,11,16,0.24)");
    darkGradient.addColorStop(1, "rgba(5,7,10,0.72)");
    ctx.fillStyle = darkGradient;
    ctx.fillRect(0, 0, 1080, 1920);

    ctx.fillStyle = "rgba(255,255,255,0.34)";
    ctx.beginPath();
    ctx.arc(120, 84, 2.5, 0, Math.PI * 2);
    ctx.arc(212, 66, 1.8, 0, Math.PI * 2);
    ctx.arc(932, 145, 3.0, 0, Math.PI * 2);
    ctx.arc(845, 110, 2.0, 0, Math.PI * 2);
    ctx.fill();

    const coverSize = 540;
    const coverX = (1080 - coverSize) / 2;
    const coverY = 108;

    fillRoundRect(coverX - 6, coverY + 14, coverSize + 12, coverSize + 12, 36, "rgba(0,0,0,0.16)");

    ctx.save();
    roundRect(ctx, coverX, coverY, coverSize, coverSize, 34);
    ctx.clip();
    ctx.fillStyle = "rgba(255,255,255,0.94)";
    ctx.fillRect(coverX, coverY, coverSize, coverSize);

    if(coverImage){
        try{
            const sourceSize = Math.min(coverImage.width, coverImage.height);
            const sx = (coverImage.width - sourceSize) / 2;
            const sy = (coverImage.height - sourceSize) / 2;
            ctx.drawImage(coverImage, sx, sy, sourceSize, sourceSize, coverX, coverY, coverSize, coverSize);
        }catch(error){
            console.warn("ジャケット画像の描画に失敗しました", error);
            ctx.fillStyle = "#f5f1eb";
            ctx.fillRect(coverX, coverY, coverSize, coverSize);
        }
    }

    ctx.restore();
    strokeRoundRect(coverX, coverY, coverSize, coverSize, 34, "rgba(255,255,255,0.70)", 2.2);

    const centerX = 540;

    ctx.fillStyle = "#ffffff";
    ctx.font = "900 76px -apple-system, BlinkMacSystemFont, sans-serif";
    const titleTop = 760;
    const titleLineCount = drawCenteredWrappedText(album.title || "Untitled", centerX, titleTop, 770, 84, 2);

    const artistTop = titleTop + (titleLineCount * 84) + 12;
    ctx.fillStyle = "#f1d39b";
    ctx.font = "800 38px -apple-system, BlinkMacSystemFont, sans-serif";
    drawCenteredWrappedText(album.artist || "Unknown Artist", centerX, artistTop, 760, 48, 2);

    drawMeterRow(960, "☾", "暗い", "☼", "明るい", album.darkness);
    drawMeterRow(1032, "♪", "静か", "✹", "激しい", album.intense);
    drawMeterRow(1104, "◯", "シンプル", "◈", "複雑", album.complex);
    drawMeterRow(1176, "✩", "絶望", "✦", "希望", album.hope);
    drawMeterRow(1248, "◉", "個人", "◎", "世界", album.world);

    const description = getDisplayDescription();
    ctx.font = "500 25px -apple-system, BlinkMacSystemFont, sans-serif";
    const descLines = splitWrappedLines(description, 730, 4);
    const reviewBoxX = 92;
    const reviewBoxY = 1308;
    const reviewBoxW = 896;
    const reviewBoxH = Math.max(166, 62 + (descLines.length * 44));

    fillRoundRect(reviewBoxX, reviewBoxY, reviewBoxW, reviewBoxH, 32, "rgba(18,20,24,0.46)");
    strokeRoundRect(reviewBoxX, reviewBoxY, reviewBoxW, reviewBoxH, 32, "rgba(255,255,255,0.12)", 1.8);

    ctx.fillStyle = "rgba(255,255,255,0.96)";
    ctx.font = "500 25px -apple-system, BlinkMacSystemFont, sans-serif";
    descLines.forEach((lineText, index) => {
        ctx.fillText(lineText, 132, reviewBoxY + 62 + (index * 44));
    });

    const keywords = getKeywordList();
    let avatarY;

    if(keywords.length > 0){
        let chipX = 128;
        const chipY = reviewBoxY + reviewBoxH + 28;
        keywords.forEach((keyword) => {
            const width = drawKeywordChip(keyword, chipX, chipY);
            chipX += width + 16;
        });
        avatarY = chipY + 96;
    }else{
        avatarY = reviewBoxY + reviewBoxH + 38;
    }

    const avatarX = 188;
    const avatarSize = 70;
    const avatarImage = posterProfile?.iconUrl ? await loadImageForCanvas(posterProfile.iconUrl) : null;

    ctx.save();
    ctx.beginPath();
    ctx.arc(avatarX + (avatarSize / 2), avatarY + (avatarSize / 2), avatarSize / 2, 0, Math.PI * 2);
    ctx.clip();

    if(avatarImage){
        try{
            ctx.drawImage(avatarImage, avatarX, avatarY, avatarSize, avatarSize);
        }catch(error){
            console.warn("アバター描画に失敗しました", error);
            fillRoundRect(avatarX, avatarY, avatarSize, avatarSize, 35, "rgba(255,255,255,0.88)");
        }
    }else{
        fillRoundRect(avatarX, avatarY, avatarSize, avatarSize, 35, "rgba(255,255,255,0.88)");
        ctx.fillStyle = "#1d2430";
        ctx.font = "800 28px -apple-system, BlinkMacSystemFont, sans-serif";
        const initial = getInitialLetter(posterProfile?.name || "匿");
        const initialWidth = ctx.measureText(initial).width;
        ctx.fillText(initial, avatarX + (avatarSize / 2) - (initialWidth / 2), avatarY + 44);
    }

    ctx.restore();

    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(avatarX + (avatarSize / 2), avatarY + (avatarSize / 2), (avatarSize / 2) - 1, 0, Math.PI * 2);
    ctx.stroke();

    const displayName = posterProfile?.name || "music_lover";
    const handleBase = String(displayName)
        .trim()
        .replace(/^@+/, "")
        .replace(/\s+/g, "_")
        .replace(/[^a-zA-Z0-9_ぁ-んァ-ヶ一-龠]/g, "") || "music_lover";

    ctx.fillStyle = "rgba(255,255,255,0.98)";
    ctx.font = "500 27px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText(`by @${handleBase}`, 280, avatarY + 43);

    const logoCenterY = Math.min(avatarY + 154, 1852);
    ctx.strokeStyle = "rgba(255,255,255,0.95)";
    ctx.lineWidth = 6;
    ctx.lineCap = "round";
    const logoBaseX = 340;
    [24, 52, 78, 52, 24].forEach((height, index) => {
        const x = logoBaseX + (index * 18);
        ctx.beginPath();
        ctx.moveTo(x, logoCenterY - (height / 2));
        ctx.lineTo(x, logoCenterY + (height / 2));
        ctx.stroke();
    });

    ctx.fillStyle = "rgba(255,255,255,0.98)";
    ctx.font = "500 38px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText("Album Collection", 438, logoCenterY + 8);

    const blob = await canvasToBlob(canvas);

    if(!blob){
        showShareToast("画像生成に失敗しました");
        return;
    }

    const fileName = `album-collection-story-${selectedShareTargetId}.png`;
    const file = new File([blob], fileName, { type:"image/png" });

    if(navigator.canShare && navigator.canShare({ files:[file] }) && navigator.share){
        try{
            await navigator.share({
                files:[file],
                title:"Album Collection",
                text:"ストーリー用画像"
            });
            closeShareMenu();
            return;
        }catch(error){
            if(error?.name !== "AbortError"){
                console.warn("画像共有に失敗しました", error);
            }
        }
    }

    const objectUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = objectUrl;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(objectUrl);

    showShareToast("ストーリー用画像を生成しました");
    closeShareMenu();
}

function formatPostDate(value){
    if(!value){
        return "";
    }

    let date = null;

    if(typeof value.toDate === "function"){
        date = value.toDate();
    } else if(value instanceof Date){
        date = value;
    } else if(typeof value === "number"){
        date = new Date(value);
    } else if(typeof value === "string"){
        const parsed = new Date(value);
        if(!Number.isNaN(parsed.getTime())){
            date = parsed;
        }
    }

    if(!date || Number.isNaN(date.getTime())){
        return "";
    }

    const now = new Date();
    const diffMs = now.getTime() - date.getTime();
    const diffMinutes = Math.floor(diffMs / 60000);
    const diffHours = Math.floor(diffMs / 3600000);
    const diffDays = Math.floor(diffMs / 86400000);

    if(diffMinutes < 1){
        return "今";
    }

    if(diffMinutes < 60){
        return `${diffMinutes}分前`;
    }

    if(diffHours < 24){
        return `${diffHours}時間前`;
    }

    if(diffDays < 7){
        return `${diffDays}日前`;
    }

    return `${date.getMonth() + 1}/${date.getDate()}`;
}

function meter(left, right, value){
    value = Number(value) || 0;
    value = Math.max(0, Math.min(5, value));

    const fillPercent = value <= 1 ? 0 : ((value - 1) / 4) * 100;

    let graphicHTML = "";

    for(let i = 1; i <= 5; i++){
        graphicHTML += `
            <div class="dot level-${i} ${i <= value ? "active" : ""} ${i === value ? "selected" : ""}"></div>
        `;

        if(i < 5){
            graphicHTML += `
                <div class="connector level-${i} ${i < value ? "active" : ""}"></div>
            `;
        }
    }

    return `
        <div class="meter">
            <div class="meter-label">${escapeHTML(left)}</div>
            <div class="meter-graphic meter-value-${value}" style="--meter-fill:${fillPercent}%;">${graphicHTML}</div>
            <div class="meter-label right-label">${escapeHTML(right)}</div>
        </div>
    `;
}

function normalizeKeywords(value){
    if(Array.isArray(value)){
        return value
            .map(keyword => String(keyword ?? "").trim())
            .filter(Boolean);
    }

    if(typeof value === "string"){
        return value
            .split(/[\s,、#]+/)
            .map(keyword => keyword.trim())
            .filter(Boolean);
    }

    return [];
}

function renderKeywordTags(value){
    const keywords = normalizeKeywords(value);

    if(keywords.length === 0){
        return "";
    }

    return keywords.map((keyword) => {
        const safeKeyword = escapeHTML(keyword);
        const encodedKeyword = encodeURIComponent(keyword);

        return `
            <button
                type="button"
                class="keyword-tag"
                data-keyword="${encodedKeyword}"
            >#${safeKeyword}</button>
        `;
    }).join("");
}

    const keyword = decodeURIComponent(keywordButton.dataset.keyword || "").trim();

    if(!keyword){
        return;
    }

    location.href = `./search.html?q=${encodeURIComponent(keyword)}`;
}, true);

function getSortedLists(){
    const items = [...allLists];

    if(currentSortMode === "new"){
        return items.sort((a, b) => getPostTime(b.data.createdAt || b.data.updatedAt) - getPostTime(a.data.createdAt || a.data.updatedAt));
    }

    if(currentSortMode.startsWith("popular_")){
        const period = currentSortMode.replace("popular_", "");
        return items
            .filter(item => isWithinPopularPeriod(item, period))
            .sort((a, b) => {
                const scoreDiff = getListPopularityScore(b) - getListPopularityScore(a);
                if(scoreDiff !== 0){
                    return scoreDiff;
                }
                return getPostTime(b.data.createdAt || b.data.updatedAt) - getPostTime(a.data.createdAt || a.data.updatedAt);
            });
    }

    return items.sort((a, b) => {
        const scoreDiff = getListSortScore(b) - getListSortScore(a);
        if(scoreDiff !== 0){
            return scoreDiff;
        }
        return getPostTime(b.data.createdAt || b.data.updatedAt) - getPostTime(a.data.createdAt || a.data.updatedAt);
    });
}

    listGrid.innerHTML = cards.join("");
}

function normalizeTextForScore(value){
    return String(value ?? "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "")
        .replace(/[　・･\-_/／｜|]+/g, "");
}

function getFavoriteArtistNames(profile){
    if(!profile){
        return [];
    }

    const fromStrings = Array.isArray(profile.favoriteArtists)
        ? profile.favoriteArtists
        : [];

    const fromObjects = Array.isArray(profile.favoriteArtistObjects)
        ? profile.favoriteArtistObjects
            .map(artist => artist?.name || artist?.artistName || artist?.label || "")
        : [];

    return [...fromStrings, ...fromObjects]
        .map(name => String(name ?? "").trim())
        .filter(Boolean);
}

function getFavoriteTags(profile){
    if(!profile || !Array.isArray(profile.favoriteTags)){
        return [];
    }

    return profile.favoriteTags
        .map(tag => String(tag ?? "").trim())
        .filter(Boolean);
}

function getPopularScore(item){
    const albumId = item.id;
    const likeCount = getLikeCount(albumId);
    const commentCount = getCommentCount(albumId);

    // コメントは行動コストが高いので、いいねより少し重くする
    return likeCount + (commentCount * 2);
}

function getFreshnessScore(item){
    const postTime = getPostTime(item.data.createdAt || item.data.updatedAt);

    if(!postTime){
        return 0;
    }

    const ageHours = Math.max(0, (Date.now() - postTime) / 3600000);

    if(ageHours <= 24){
        return 18;
    }

    if(ageHours <= 72){
        return 10;
    }

    if(ageHours <= 168){
        return 5;
    }

    return 0;
}

function getRecommendScore(item){
    const album = item.data || {};
    let score = 0;

    const postArtist = normalizeTextForScore(album.artist || "");
    const postKeywords = normalizeKeywords(album.keywords)
        .map(keyword => normalizeTextForScore(keyword));

    const favoriteArtists = getFavoriteArtistNames(currentUserProfile)
        .map(name => normalizeTextForScore(name))
        .filter(Boolean);

    const favoriteTags = getFavoriteTags(currentUserProfile)
        .map(tag => normalizeTextForScore(tag))
        .filter(Boolean);

    favoriteArtists.forEach((artistName) => {
        if(postArtist && artistName && (postArtist.includes(artistName) || artistName.includes(postArtist))){
            score += 60;
        }
    });

    favoriteTags.forEach((tag) => {
        if(postKeywords.includes(tag)){
            score += 25;
        }
    });

    score += getPopularScore(item) * 4;
    score += getFreshnessScore(item);

    // おすすめ順では、自分の投稿が好み一致で上に来すぎないように少し下げる
    // 非表示にはせず、人気や新しさがあればある程度は上がれる
    if(currentUser && album.userId === currentUser.uid){
        score -= 180;
    }

    return score;
}

function isWithinPopularPeriod(item, period){
    if(period === "all"){
        return true;
    }

    const postTime = getPostTime(item.data.createdAt || item.data.updatedAt);

    if(!postTime){
        return false;
    }

    const diff = Date.now() - postTime;

    if(period === "24h"){
        return diff <= 24 * 60 * 60 * 1000;
    }

    if(period === "7d"){
        return diff <= 7 * 24 * 60 * 60 * 1000;
    }

    return true;
}

function getSortedAlbums(baseItems = allAlbums){
    const items = [...baseItems];

    if(currentSortMode === "new"){
        return items.sort((a, b) => {
            const aTime = getPostTime(a.data.createdAt || a.data.updatedAt);
            const bTime = getPostTime(b.data.createdAt || b.data.updatedAt);
            return bTime - aTime;
        });
    }

    if(currentSortMode.startsWith("popular_")){
        const period = currentSortMode.replace("popular_", "");

        return items
            .filter(item => isWithinPopularPeriod(item, period))
            .sort((a, b) => {
                const scoreDiff = getPopularScore(b) - getPopularScore(a);

                if(scoreDiff !== 0){
                    return scoreDiff;
                }

                const aTime = getPostTime(a.data.createdAt || a.data.updatedAt);
                const bTime = getPostTime(b.data.createdAt || b.data.updatedAt);
                return bTime - aTime;
            });
    }

    return items.sort((a, b) => {
        const scoreDiff = getRecommendScore(b) - getRecommendScore(a);

        if(scoreDiff !== 0){
            return scoreDiff;
        }

        const aTime = getPostTime(a.data.createdAt || a.data.updatedAt);
        const bTime = getPostTime(b.data.createdAt || b.data.updatedAt);
        return bTime - aTime;
    });
}

function getRecommendAlbums(){
    return getSortedAlbums(allAlbums);
}

function getFollowingAlbums(){
    if(!currentUser){
        return [];
    }

    const followingAlbums = allAlbums.filter((album) => {
        const userId = album.data.userId || "";
        return userId !== currentUser.uid && followingIds.has(userId);
    });

    return getSortedAlbums(followingAlbums);
}

function getFollowingLists(){
    if(!currentUser){
        return [];
    }

    return allLists.filter((list) => {
        const userId = list.data.userId || "";
        return userId !== currentUser.uid && followingIds.has(userId);
    });
}

function getFeedItemPopularScore(item){
    if(item.kind === "list"){
        return getListPopularityScore(item);
    }

    return getPopularScore(item);
}

function getFeedItemRecommendScore(item){
    if(item.kind === "list"){
        return (getFeedItemPopularScore(item) * 4) + getFreshnessScore(item);
    }

    return getRecommendScore(item);
}

function isFeedItemWithinPopularPeriod(item, period){
    return isWithinPopularPeriod(item, period);
}

function sortFeedItems(items){
    const cloned = [...items];

    if(currentSortMode === "new"){
        return cloned.sort((a, b) => getPostTime(b.data.createdAt || b.data.updatedAt) - getPostTime(a.data.createdAt || a.data.updatedAt));
    }

    if(currentSortMode.startsWith("popular_")){
        const period = currentSortMode.replace("popular_", "");
        return cloned
            .filter(item => isFeedItemWithinPopularPeriod(item, period))
            .sort((a, b) => {
                const scoreDiff = getFeedItemPopularScore(b) - getFeedItemPopularScore(a);
                if(scoreDiff !== 0){
                    return scoreDiff;
                }
                return getPostTime(b.data.createdAt || b.data.updatedAt) - getPostTime(a.data.createdAt || a.data.updatedAt);
            });
    }

    return cloned.sort((a, b) => {
        const scoreDiff = getFeedItemRecommendScore(b) - getFeedItemRecommendScore(a);
        if(scoreDiff !== 0){
            return scoreDiff;
        }
        return getPostTime(b.data.createdAt || b.data.updatedAt) - getPostTime(a.data.createdAt || a.data.updatedAt);
    });
}

function getFollowingFeedItems(){
    if(!currentUser){
        return [];
    }

    const albumItems = getFollowingAlbums().map(item => ({ ...item, kind:"album" }));
    const listItems = getFollowingLists().map(item => ({ ...item, kind:"list" }));
    return sortFeedItems([...albumItems, ...listItems]);
}

function getPostTime(value){
    if(!value){ return 0; }
    if(typeof value.toDate === "function"){ return value.toDate().getTime(); }
    if(value instanceof Date){ return value.getTime(); }
    if(typeof value === "number"){ return value; }
    if(typeof value === "string"){
        const parsed = new Date(value);
        if(!Number.isNaN(parsed.getTime())){ return parsed.getTime(); }
    }
    return 0;
}


/* ============================================================
   FEED TAB CONTROLLER 2026-06-12
   - おすすめ / 観測 / リストの切替をここだけで管理
   - 起動時に勝手におすすめへ戻さない
   - 横スワイプとタップを両方サポート
============================================================ */
const FEED_MODES = ["recommend", "following", "list"];
const IS_OBSERVATION_PAGE = location.pathname.split("/").pop() === "observation.html";
let feedScrollTicking = false;
let feedTouchStartX = 0;
let feedTouchStartY = 0;
let feedTouchMode = null;

function normalizeFeedMode(mode){
    if(IS_OBSERVATION_PAGE){ return "following"; }
    if(mode === "list"){ return "list"; }
    return "recommend";
}

function feedModeToIndex(mode){
    if(IS_OBSERVATION_PAGE){ return 0; }
    if(mode === "list"){ return 1; }
    return 0;
}

function feedIndexToMode(index){
    if(IS_OBSERVATION_PAGE){ return "following"; }
    return index >= 0.5 ? "list" : "recommend";
}

function getFeedProgress(){
    if(!feedSwipe || window.innerWidth > 900){
        return feedModeToIndex(currentFeedMode);
    }

    return Math.max(0, Math.min(2, feedSwipe.scrollLeft / Math.max(1, feedSwipe.clientWidth)));
}

function applyFeedMode(mode, progress = null){
    const nextMode = normalizeFeedMode(mode);
    currentFeedMode = nextMode;

    if(document.body){
        document.body.dataset.feedMode = nextMode;
    }

    const activeIndex = feedModeToIndex(nextMode);
    const underlineIndex = activeIndex;
    const tabs = document.getElementById("mobileFeedTabs");

    if(recommendTab){
        recommendTab.classList.toggle("active", nextMode === "recommend");
        recommendTab.setAttribute("aria-selected", nextMode === "recommend" ? "true" : "false");
    }

    if(followingTab){
        followingTab.classList.toggle("active", nextMode === "following");
        followingTab.setAttribute("aria-selected", nextMode === "following" ? "true" : "false");
    }

    if(listTab){
        listTab.classList.toggle("active", nextMode === "list");
        listTab.setAttribute("aria-selected", nextMode === "list" ? "true" : "false");
    }

    if(tabs){
        tabs.dataset.activeFeed = nextMode;
        tabs.style.setProperty("--feed-progress", underlineIndex.toFixed(4));
        tabs.style.setProperty("--recommend-tab-opacity", nextMode === "recommend" ? "1" : "0.58");
        tabs.style.setProperty("--following-tab-opacity", nextMode === "following" ? "1" : "0.58");
        tabs.style.setProperty("--list-tab-opacity", nextMode === "list" ? "1" : "0.58");
    }
}

function updateFeedTabs(progress = null){
    if(typeof progress === "number"){
        applyFeedMode(feedIndexToMode(progress), progress);
        return;
    }

    applyFeedMode(feedIndexToMode(getFeedProgress()), getFeedProgress());
}

function resetPageTopForFeed(){
    window.scrollTo({ top:0, left:0, behavior:"auto" });
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
    document.body.classList.remove("mobile-head-hidden");
}

function scrollFeedTo(mode, options = {}){
    const nextMode = normalizeFeedMode(mode);

    if(mode === "following" && !IS_OBSERVATION_PAGE){
        location.href = "observation.html";
        return;
    }

    if(IS_OBSERVATION_PAGE && mode !== "following"){
        location.href = "index.html";
        return;
    }

    const index = feedModeToIndex(nextMode);
    const smooth = options.smooth !== false;
    const resetTop = options.resetTop !== false;

    applyFeedMode(nextMode, index);

    if(resetTop && window.innerWidth <= 900){
        resetPageTopForFeed();
    }

    if(feedSwipe && window.innerWidth <= 900){
        feedSwipe.scrollTo({
            left:feedSwipe.clientWidth * index,
            behavior:smooth ? "smooth" : "auto"
        });
    }
}

window.scrollFeedTo = scrollFeedTo;
window.updateFeedTabs = updateFeedTabs;
window.resetFeedToRecommendOnOpen = function(){
    applyFeedMode(currentFeedMode, feedModeToIndex(currentFeedMode));
};

if(recommendTab){
    recommendTab.addEventListener("click", (event) => {
        event.preventDefault();
        scrollFeedTo("recommend");
    });
}

if(followingTab){
    followingTab.addEventListener("click", (event) => {
        event.preventDefault();
        scrollFeedTo("following");
    });
}

if(listTab){
    listTab.addEventListener("click", (event) => {
        event.preventDefault();
        scrollFeedTo("list");
    });
}

if(feedSwipe){
    feedSwipe.addEventListener("touchstart", (event) => {
        if(window.innerWidth > 900 || !event.touches || event.touches.length !== 1){
            return;
        }

        feedTouchStartX = event.touches[0].clientX;
        feedTouchStartY = event.touches[0].clientY;
        feedTouchMode = null;
    }, { passive:true });

    feedSwipe.addEventListener("touchmove", (event) => {
        if(window.innerWidth > 900 || !event.touches || event.touches.length !== 1){
            return;
        }

        const mode = document.body?.dataset?.feedMode || currentFeedMode;
        const dx = event.touches[0].clientX - feedTouchStartX;
        const dy = event.touches[0].clientY - feedTouchStartY;
        const absX = Math.abs(dx);
        const absY = Math.abs(dy);

        if(!feedTouchMode && Math.max(absX, absY) > 8){
            feedTouchMode = absX >= absY ? "horizontal" : "vertical";
        }

        if(mode === "following" && feedTouchMode === "vertical"){
            event.preventDefault();
            event.stopPropagation();
        }
    }, { passive:false });

    feedSwipe.addEventListener("scroll", () => {
        if(window.innerWidth > 900 || feedScrollTicking){
            return;
        }

        feedScrollTicking = true;
        requestAnimationFrame(() => {
            const progress = getFeedProgress();
            applyFeedMode(feedIndexToMode(progress), progress);
            feedScrollTicking = false;
        });
    }, { passive:true });
}

window.addEventListener("scroll", () => {
    if(window.innerWidth > 900){
        return;
    }

    const currentY = window.scrollY || document.documentElement.scrollTop || 0;
    document.body.classList.remove("mobile-head-hidden");
    document.body.dataset.lastScrollY = String(currentY);
}, { passive:true });

window.addEventListener("resize", () => {
    if(feedSwipe && window.innerWidth <= 900){
        feedSwipe.scrollTo({
            left:feedSwipe.clientWidth * feedModeToIndex(currentFeedMode),
            behavior:"auto"
        });
    }
    updateFeedTabs(feedModeToIndex(currentFeedMode));
});

applyFeedMode(currentFeedMode, feedModeToIndex(currentFeedMode));

async function buildObservationGroups(){
    const items = getObservationFeedItems();
    const groupMap = new Map();

    for(const item of items){
        const userId = item?.data?.userId || "unknown";
        const age = getObservationAgeInfo(item);
        const profile = await getPosterProfileForAlbum(item.data);

        if(!groupMap.has(userId)){
            groupMap.set(userId, {
                userId,
                profile,
                items:[],
                latestTime:0,
                latestDiffHours:999999,
                recentCount:0
            });
        }

        const group = groupMap.get(userId);
        group.items.push(item);
        group.latestTime = Math.max(group.latestTime, age.postTime);
        group.latestDiffHours = Math.min(group.latestDiffHours, age.diffHours);

        if(age.diffHours <= 24){
            group.recentCount += 1;
        }
    }

    return [...groupMap.values()]
        .filter(group => group.items.length > 0)
        .sort((a, b) => b.latestTime - a.latestTime)
        .slice(0, 7);
}

function openObservationGroup(groupIndex = 0, postIndex = 0){
    const viewer = document.getElementById("observationViewer");

    if(!viewer || observationGroups.length === 0){
        return;
    }

    activeObservationGroupIndex = Math.max(0, Math.min(observationGroups.length - 1, Number(groupIndex) || 0));
    const group = observationGroups[activeObservationGroupIndex];
    activeObservationPostIndex = Math.max(0, Math.min(group.items.length - 1, Number(postIndex) || 0));

    renderObservationViewer();
    viewer.classList.add("open");
    viewer.setAttribute("aria-hidden", "false");
}

function openObservationNewest(){
    if(observationGroups.length === 0){
        return;
    }

    openObservationGroup(0, 0);
}

function closeObservationViewer(){
    const viewer = document.getElementById("observationViewer");
    if(!viewer){ return; }
    viewer.classList.remove("open");
    viewer.setAttribute("aria-hidden", "true");
}

function nextObservationPost(){
    const group = observationGroups[activeObservationGroupIndex];
    if(!group){ return; }

    if(activeObservationPostIndex < group.items.length - 1){
        activeObservationPostIndex += 1;
    }else if(activeObservationGroupIndex < observationGroups.length - 1){
        activeObservationGroupIndex += 1;
        activeObservationPostIndex = 0;
    }else{
        activeObservationGroupIndex = 0;
        activeObservationPostIndex = 0;
    }

    renderObservationViewer();
}

function prevObservationPost(){
    if(activeObservationPostIndex > 0){
        activeObservationPostIndex -= 1;
    }else if(activeObservationGroupIndex > 0){
        activeObservationGroupIndex -= 1;
        const group = observationGroups[activeObservationGroupIndex];
        activeObservationPostIndex = Math.max(0, group.items.length - 1);
    }else{
        activeObservationGroupIndex = observationGroups.length - 1;
        const group = observationGroups[activeObservationGroupIndex];
        activeObservationPostIndex = Math.max(0, group.items.length - 1);
    }

    renderObservationViewer();
}

/* ============================================================
   DAILY METEOR V1 2026-06-11
   - ホームに「知らない人の投稿が毎日1件届く」機能を追加
   - 新規投稿形式は増やさず、既存の albums / lists から1件選ぶ
============================================================ */

function getDailyMeteorDateKey(){
    try{
        return new Intl.DateTimeFormat("sv-SE", { timeZone:"Asia/Tokyo", year:"numeric", month:"2-digit", day:"2-digit" }).format(new Date());
    }catch(error){
        return new Date().toISOString().slice(0, 10);
    }
}

function hashDailyMeteorSeed(text){
    let hash = 2166136261;
    const source = String(text || "");
    for(let i = 0; i < source.length; i++){
        hash ^= source.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
    }
    return Math.abs(hash >>> 0);
}

function getDailyMeteorCandidates(){
    const albumItems = (allAlbums || []).map(item => ({ ...item, kind:"album" }));
    const listItems = (allLists || []).map(item => ({ ...item, kind:"list" }));

    return [...albumItems, ...listItems]
        .filter(item => {
            const userId = item?.data?.userId || "";
            if(!userId){ return false; }
            if(currentUser && userId === currentUser.uid){ return false; }
            if(followingIds && followingIds.has(userId)){ return false; }
            return true;
        })
        .sort((a, b) => {
            const timeA = getPostTime(a.data.createdAt || a.data.updatedAt);
            const timeB = getPostTime(b.data.createdAt || b.data.updatedAt);
            return timeB - timeA;
        })
        .slice(0, 80);
}

function selectDailyMeteorItem(candidates){
    if(!candidates.length){ return null; }

    const dateKey = getDailyMeteorDateKey();
    const userKey = currentUser?.uid || "guest";
    const storageKey = `albumCollectionDailyMeteor:${userKey}`;

    try{
        const saved = JSON.parse(localStorage.getItem(storageKey) || "null");
        if(saved?.dateKey === dateKey){
            const savedItem = candidates.find(item => item.kind === saved.kind && item.id === saved.id);
            if(savedItem){ return savedItem; }
        }
    }catch(error){
        // localStorageが使えない環境では、その場で日付ベース選定に戻す
    }

    const seed = `${dateKey}:${userKey}:${candidates.map(item => `${item.kind}:${item.id}`).join("|")}`;
    const selected = candidates[hashDailyMeteorSeed(seed) % candidates.length];

    try{
        localStorage.setItem(storageKey, JSON.stringify({
            dateKey,
            kind:selected.kind,
            id:selected.id
        }));
    }catch(error){
        // 保存できなくても表示自体は続ける
    }

    return selected;
}

function getDailyMeteorSnippet(item){
    const text = getObservationText(item);
    if(text){ return text; }
    return "知らない誰かの音楽ログが、1日1件だけ届きます。";
}

function dailyMeteorCoverHTML(item){
    const coverUrl = getObservationCoverUrl(item);
    if(coverUrl){
        return `<img src="${escapeHTML(coverUrl)}" alt="">`;
    }
    return `<div class="daily-meteor-cover-fallback">✦</div>`;
}

async function renderDailyMeteor(){
    if(!dailyMeteorBox){ return; }

    const candidates = getDailyMeteorCandidates();
    const item = selectDailyMeteorItem(candidates);
    dailyMeteorItem = item;

    if(!item){
        dailyMeteorBox.innerHTML = "";
        return;
    }

    const profile = await getPosterProfileForAlbum(item.data);
    const name = profile?.name || "知らないユーザー";
    const title = getObservationTitle(item);
    const artist = getObservationArtist(item);
    const ariaText = ["今日の流れ星を開く", name, title, artist].filter(Boolean).join(" / ");

    dailyMeteorBox.innerHTML = `
        <button type="button" class="daily-meteor-card" onclick="openDailyMeteorPost()" aria-label="${escapeHTML(ariaText)}" title="${escapeHTML([name, title, artist].filter(Boolean).join(" ・ "))}">
            <span class="daily-meteor-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M12 20v-8"/><path d="M8 20h8"/><path d="M12 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/><path d="M7 9a5 5 0 0 1 10 0"/><path d="M4 9a8 8 0 0 1 16 0"/></svg>
            </span>
            <span class="daily-meteor-copy">
                <span class="daily-meteor-title">流れ星が観測されました</span>
                <span class="daily-meteor-sub">タップして受信する</span>
            </span>
            <span class="daily-meteor-arrow" aria-hidden="true">›</span>
        </button>
    `;
}

function openDailyMeteorPost(){
    if(!dailyMeteorItem){ return; }
    location.href = getObservationDetailUrl(dailyMeteorItem);
}

<script>
/* 流れ星バナーだけをスクロールに合わせて自然にフェードさせる */
(function(){
    let ticking = false;

    function getCurrentScrollY(){
        const activePanel = document.querySelector(".feed-panel.is-visible") || document.querySelector(".feed-panel");
        const values = [
            window.scrollY || 0,
            document.documentElement.scrollTop || 0,
            document.body.scrollTop || 0,
            document.getElementById("feedSwipe")?.scrollTop || 0,
            activePanel?.scrollTop || 0,
            document.getElementById("recommendGrid")?.scrollTop || 0
        ];
        return Math.max(...values);
    }

    function updateMeteorFade(){
        const y = getCurrentScrollY();
        const opacity = Math.max(0, Math.min(1, 1 - (y / 118)));
        const offset = Math.min(18, y * 0.10);

        document.documentElement.style.setProperty("--daily-meteor-opacity", opacity.toFixed(3));
        document.documentElement.style.setProperty("--daily-meteor-offset", `${offset.toFixed(1)}px`);
        document.body.dataset.meteorHidden = opacity < 0.08 ? "true" : "false";
        ticking = false;
    }

    window.addEventListener("scroll", () => {
        if(ticking){ return; }
        ticking = true;
        requestAnimationFrame(updateMeteorFade);
    }, { passive:true });

    document.addEventListener("scroll", () => {
        if(ticking){ return; }
        ticking = true;
        requestAnimationFrame(updateMeteorFade);
    }, { passive:true, capture:true });

    document.addEventListener("touchmove", () => {
        if(ticking){ return; }
        ticking = true;
        requestAnimationFrame(updateMeteorFade);
    }, { passive:true });

    document.addEventListener("DOMContentLoaded", updateMeteorFade);
})();
</script>
