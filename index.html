<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Album Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700;900&display=swap" rel="stylesheet">



<style>
/* ============================================================
   Album Collection index.html
   CSS整理版
   - 既存の多重 <style> を1つに統合
   - 同一セレクタ内の重複プロパティは最後の指定だけ残す
   - SVGアイコン + Pale Ice + 銀河背景の最終デザインを維持
============================================================ */

@keyframes galaxyDrift {
    0%   { background-position:center top, 0 0, 0 0, 0 0, 0 0; }
    50%  { background-position:center top, -80px 40px, 18px -14px, -26px 18px, 36px -22px; }
    100% { background-position:center top, -160px 80px, 36px -28px, -52px 36px, 72px -44px; }
}

@keyframes milkywayDrift {
    0% {
        background-position:
            center top,
            50% 28%,
            56% 52%,
            0 0,
            0 0,
            0 0,
            0 0;
    }
    50% {
        background-position:
            center top,
            49% 30%,
            57% 50%,
            -24px 18px,
            18px -16px,
            -16px 12px,
            22px -18px;
    }
    100% {
        background-position:
            center top,
            48% 32%,
            58% 48%,
            -48px 36px,
            36px -32px,
            -32px 24px,
            44px -36px;
    }
}

@keyframes deluxeStarfield {
    0% {
        background-position:
            center top,
            center top,
            50% 18%,
            52% 52%,
            0 0,
            0 0,
            0 0,
            0 0;
    }
    50% {
        background-position:
            center top,
            center top,
            49% 20%,
            53% 50%,
            -18px 12px,
            16px -14px,
            -12px 10px,
            18px -16px;
    }
    100% {
        background-position:
            center top,
            center top,
            48% 22%,
            54% 48%,
            -36px 24px,
            32px -28px,
            -24px 20px,
            36px -32px;
    }
}

@keyframes milkywayPan {
    0%   { background-position:center top; }
    50%  { background-position:center 22px; }
    100% { background-position:center top; }
}

:root{
    --bg:#050505;
    --panel:#080909;
    --panel-2:#0b0d0e;
    --border:rgba(255,255,255,0.15);
    --border-soft:rgba(255,255,255,0.10);
    --text:#ffffff;
    --text-soft:#dce3e6;
    --muted:#aab3b8;
    --accent:#9fcdd9;
    --accent-hover:#b7dfe7;
    --pale-1:#7faebb;
    --pale-2:#9bc7d0;
    --pale-3:#b9dde3;
    --pale-4:#d7edf0;
    --pale-5:#edf8f9;
    --meter-off:#48555b;
    --meter-line-off:#333d42;
    --space-bg:#03070d;
    --space-panel:rgba(5,9,14,0.52);
    --space-panel-strong:rgba(5,9,14,0.72);
    --space-border:rgba(159,205,217,0.20);
    --space-border-soft:rgba(159,205,217,0.12);
    --space-purple:#9fcdd9;
    --space-purple-2:#d7edf0;
    --space-blue:#9fcdd9;
    --space-text:#f7fbff;
    --space-muted:#aeb8c8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    min-height:100%;
    background:#030814 !important;
}

body{
    background:#030814 !important;
    color:var(--text);
    font-family:"SF Pro Display",
        "SF Pro Text",
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Sans",
        "Hiragino Kaku Gothic ProN",
        "Noto Sans JP",
        sans-serif !important;
    padding:38px 30px 120px 252px;
    position:relative;
    isolation:isolate;
    background-color:#030814 !important;
    background-image:none !important;
    background-size:100% auto,
        100% auto !important;
    background-repeat:repeat-y,
        repeat-y !important;
    background-position:center top,
        center top !important;
    background-attachment:scroll,
        scroll !important;
    font-weight:400 !important;
    letter-spacing:-0.018em !important;
    --milkyway-shift:0px;
    font-feature-settings:"palt" 1;
    -webkit-font-smoothing:antialiased;
    text-rendering:geometricPrecision;
}

a{
    color:inherit;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:26px;
}

.page-title{
    font-size:30px !important;
    font-weight:680 !important;
    letter-spacing:-0.055em !important;
    text-shadow:0 0 16px rgba(255,255,255,0.06),
        0 0 32px rgba(159,205,217,0.12) !important;
}

.album-grid{
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:24px;
    max-width:1230px;
    margin:0;
}

.album-card{
    background:#070808;
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    cursor:pointer;
    overflow:hidden;
    display:grid;
    grid-template-columns:200px minmax(0, 1fr);
    gap:20px;
    align-items:stretch;
    box-shadow:none;
    position:relative;
}

.album-card:hover{
    border-color:rgba(159,205,217,0.42);
    transform:translateY(-1px);
    transition:0.18s ease;
}

.album-main{
    min-width:0;
    display:block;
}

.cover{
    width:160px;
    height:160px;
    aspect-ratio:1/1;
    object-fit:cover;
    background:#111;
    display:block;
    border:1px solid rgba(255,255,255,0.16);
    border-radius:4px;
    margin:0 0 12px 0;
}

.album-text{
    min-width:0;
}

.title{
    font-size:25px;
    font-weight:900;
    line-height:1.06;
    letter-spacing:-0.045em;
    margin-bottom:5px;
    word-break:break-word;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.artist{
    color:var(--accent);
    font-size:15px;
    font-weight:800;
    line-height:1.25;
    margin-bottom:6px;
    word-break:break-word;
}

.meta{
    color:#c5cbd0;
    font-size:11px;
    line-height:1.35;
    margin-bottom:8px;
    word-break:break-word;
    display:-webkit-box;
    -webkit-line-clamp:1;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.description{
    color:var(--text-soft);
    font-size:11.5px;
    line-height:1.58;
    margin-bottom:8px;
    word-break:break-word;
    display:none !important;
    -webkit-line-clamp:4;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.creator{
    color:var(--muted);
    font-size:11.5px;
    line-height:1.45;
    margin-bottom:7px;
    word-break:break-word;
}

.creator a{
    color:var(--accent);
    text-decoration:none;
}

.creator a:hover{
    text-decoration:underline;
}

.creator-highlight{
    margin-bottom:10px;
}

.creator-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:0;
    border:none;
    border-radius:0;
    background:transparent;
    text-decoration:none;
    max-width:100%;
}

.creator-link:hover{
    background:transparent;
    text-decoration:none !important;
}

.creator-avatar,
.creator-avatar-fallback{
    width:30px;
    height:30px;
    border-radius:50%;
    flex:0 0 30px;
    background:rgba(255,255,255,0.10);
    border:1px solid rgba(255,255,255,0.12);
}

.creator-avatar{
    display:block;
    object-fit:cover;
}

.creator-avatar-fallback{
    display:flex;
    align-items:center;
    justify-content:center;
    color:#edf8f9;
    font-size:13px;
    font-weight:700;
    letter-spacing:-0.03em;
}

.creator-text{
    display:inline-flex;
    align-items:baseline;
    gap:2px;
    min-width:0;
    max-width:100%;
}

.creator-prefix{
    color:#aab3b8;
    font-size:12px;
    font-weight:500;
    line-height:1.1;
    white-space:nowrap;
}

.creator-name{
    color:#ffffff;
    font-size:14px;
    font-weight:650;
    line-height:1.1;
    letter-spacing:-0.02em;
    display:-webkit-box;
    -webkit-line-clamp:1;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.reaction-row{
    display:flex;
    align-items:center;
    gap:10px;
    color:#b6c0c4;
    font-size:11.5px;
    flex-wrap:wrap;
}

.like-area{
    display:flex;
    align-items:center;
    gap:6px;
}

.like-btn{
    background:none;
    border:none;
    color:#b6c0c4;
    padding:0;
    font-size:16px;
    cursor:pointer;
    line-height:1;
}

.like-btn:hover,
.like-btn.liked{
    color:white;
}

.like-count,
.comment-count{
    font-size:11.5px;
    color:#b6c0c4;
}

.share-area{
    position:relative;
    display:flex;
    align-items:center;
}

.share-btn{
    appearance:none;
    -webkit-appearance:none;
    border:none;
    background:rgba(255,255,255,0.055);
    color:#dbe4e7;
    font-family:inherit;
    font-size:11.5px;
    font-weight:700;
    line-height:1;
    border-radius:999px;
    padding:7px 10px;
    cursor:pointer;
}

.share-btn:hover{
    background:rgba(159,205,217,0.16);
    color:#ffffff;
}

.share-sheet{
    position:fixed;
    inset:0;
    display:none;
    align-items:flex-end;
    justify-content:center;
    background:rgba(0,0,0,0.58);
    z-index:20000;
    padding:18px;
}

.share-sheet.open{
    display:flex;
}

.share-panel{
    width:min(420px,100%);
    background:#0b0d0e;
    border:1px solid rgba(255,255,255,0.14);
    border-radius:22px;
    padding:16px;
    box-shadow:0 20px 60px rgba(0,0,0,0.55);
}

.share-panel-title{
    font-size:16px;
    font-weight:900;
    margin-bottom:4px;
}

.share-panel-subtitle{
    color:#aab3b8;
    font-size:12px;
    line-height:1.45;
    margin-bottom:14px;
}

.share-actions{
    display:grid;
    gap:8px;
}

.share-action-btn{
    appearance:none;
    -webkit-appearance:none;
    width:100%;
    border:1px solid rgba(255,255,255,0.12);
    background:rgba(255,255,255,0.045);
    color:white;
    font-family:inherit;
    font-size:14px;
    font-weight:800;
    text-align:left;
    border-radius:14px;
    padding:13px 14px;
    cursor:pointer;
}

.share-action-btn:hover{
    border-color:rgba(159,205,217,0.42);
    background:rgba(159,205,217,0.10);
}

.share-close-btn{
    margin-top:10px;
    width:100%;
    border:none;
    background:transparent;
    color:#aab3b8;
    font-family:inherit;
    font-size:13px;
    font-weight:800;
    padding:12px;
    cursor:pointer;
}

.share-toast{
    position:fixed;
    left:50%;
    bottom:92px;
    transform:translateX(-50%) translateY(10px);
    background:#edf8f9;
    color:#050505;
    border-radius:999px;
    padding:10px 15px;
    font-size:13px;
    font-weight:900;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
    z-index:21000;
}

.share-toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.album-analysis{
    min-width:0;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    border:1px solid rgba(255,255,255,0.13);
    border-radius:14px;
    padding:17px 14px 14px;
    background:rgba(4,7,13,0.24) !important;
    border-color:rgba(196,215,255,0.14) !important;
}

.meter-list{
    display:block;
}

.meter{
    display:grid;
    grid-template-columns:52px minmax(0,1fr) 58px;
    align-items:center;
    gap:10px;
    margin-bottom:26px;
    min-width:0;
    width:100%;
}

.meter:last-of-type{
    margin-bottom:0;
}

.meter-label{
    color:#f3f7f8;
    font-size:13px;
    font-weight:500 !important;
    line-height:1;
    white-space:nowrap;
}

.right-label{
    text-align:right;
}

.meter-graphic{
    display:flex;
    align-items:center;
    width:100%;
    min-width:0;
    overflow:hidden;
}

.dot{
    width:12px !important;
    height:12px !important;
    border-radius:50%;
    border:2px solid var(--meter-off);
    background:transparent;
    flex:0 0 16px;
    flex-basis:12px !important;
}

.connector{
    height:1px !important;
    background:var(--meter-line-off);
    flex:1;
    min-width:8px;
}

.dot.active.level-1,
.connector.active.level-1{
    background:#7656ff !important;
    border-color:#7656ff !important;
}

.dot.active.level-2,
.connector.active.level-2{
    background:#906dff !important;
    border-color:#906dff !important;
}

.dot.active.level-3,
.connector.active.level-3{
    background:#ad8cff !important;
    border-color:#ad8cff !important;
}

.dot.active.level-4,
.connector.active.level-4{
    background:#c7b1ff !important;
    border-color:#c7b1ff !important;
}

.dot.active.level-5,
.connector.active.level-5{
    background:#eff4ff !important;
    border-color:#eff4ff !important;
}

.dot.active{
    box-shadow:0 0 16px rgba(159,205,217,0.14);
}

.keyword-box{
    margin-top:14px;
    border:1px solid var(--border-soft);
    border-radius:8px;
    padding:9px 10px;
    display:grid;
    grid-template-columns:62px minmax(0,1fr);
    gap:10px;
    align-items:start;
}

.keyword-title{
    color:#9fcdd9 !important;
    font-size:11px;
    font-weight:800;
}

.keyword-text{
    color:#dde6e8;
    font-size:10.5px;
    line-height:1.5;
    word-break:break-word;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.keyword-tags{
    min-width:0;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    max-height:42px;
    overflow:hidden;
}

.keyword-tag{
    appearance:none;
    -webkit-appearance:none;
    border:1px solid rgba(255,255,255,0.12);
    cursor:pointer;
    font-family:inherit;
    display:inline-flex;
    align-items:center;
    max-width:100%;
    color:#dde6e8;
    font-size:10.5px;
    line-height:1;
    text-decoration:none;
    word-break:break-word;
    border-radius:999px;
    padding:5px 8px;
    background:rgba(255,255,255,0.025);
}

.keyword-tag:hover{
    border-color:rgba(159,205,217,0.48);
    color:white;
}

.empty{
    color:#888;
    font-size:24px;
}

.sidebar{
    position:fixed;
    top:0;
    left:0;
    width:220px;
    height:100vh;
    background:rgba(3,6,12,0.74) !important;
    border-right:1px solid var(--space-border-soft) !important;
    padding:28px 20px;
    overflow-y:auto;
    z-index:100;
    box-shadow:18px 0 48px rgba(0,0,0,0.28) !important;
}

.logo{
    font-size:28px;
    font-weight:800;
    line-height:1.04;
    margin-bottom:28px;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:14px 16px;
    margin-bottom:8px;
    border-radius:12px;
    font-size:15px;
}

.sidebar a:hover{
    background:#141617;
}

.sidebar a.active{
    background:#17191a;
    color:var(--accent);
}

.mobile-feed-tabs{
    display:none;
}

.feed-tab{
    appearance:none;
    -webkit-appearance:none;
    border:none;
    background:transparent;
    color:rgba(215,237,240,0.52) !important;
    font:inherit;
    cursor:pointer;
}

.mobile-tabbar{
    display:none;
}

.mobile-tabbar a{
    color:rgba(215,237,240,0.58) !important;
    text-decoration:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    font-size:11px;
    flex:1;
    font-family:"SF Pro Text",
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Sans",
        "Noto Sans JP",
        sans-serif !important;
    font-weight:400 !important;
}

.mobile-tabbar a.active{
    color:#d7edf0 !important;
    font-weight:700;
}

.mobile-tabbar .icon{
    font-size:22px;
    line-height:1;
    filter:drop-shadow(0 0 3px rgba(159,205,217,0.34))
        drop-shadow(0 0 8px rgba(159,205,217,0.12)) !important;
}

.mobile-tabbar .label{
    line-height:1;
    white-space:nowrap;
}

.mobile-tabbar .tab-avatar{
    width:28px;
    height:28px;
    border-radius:50%;
    object-fit:cover;
    background:#111;
    border:1px solid rgba(255,255,255,0.35);
    display:none;
}

.mobile-tabbar .mypage-icon-text{
    font-size:22px;
    line-height:1;
    height:24px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.fab{
    position:fixed;
    right:24px;
    bottom:24px;
    width:64px;
    height:64px;
    border-radius:50%;
    background:var(--accent);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    text-decoration:none;
    box-shadow:0 8px 24px rgba(0,0,0,0.45);
    z-index:1000;
}

.fab:hover{
    background:var(--accent-hover);
}

.feed-swipe{
    width:100%;
}

.feed-panel{
    min-width:0;
}

.tutorial-overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:rgba(0,0,0,0.72);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    z-index:30000;
}

.tutorial-overlay.is-active{
    display:flex;
}

.tutorial-card{
    width:100%;
    max-width:430px;
    background:linear-gradient(145deg,#151819,#080909);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:28px;
    padding:28px 24px 22px;
    box-shadow:0 24px 80px rgba(0,0,0,0.58);
    color:white;
    position:relative;
    overflow:hidden;
}

.tutorial-card::before{
    content:"";
    position:absolute;
    inset:-120px -80px auto auto;
    width:220px;
    height:220px;
    border-radius:50%;
    background:rgba(159,205,217,0.14);
    filter:blur(10px);
    pointer-events:none;
}

.tutorial-close{
    position:absolute;
    top:14px;
    right:14px;
    width:34px;
    height:34px;
    border:none;
    border-radius:999px;
    background:rgba(255,255,255,0.08);
    color:white;
    font-family:inherit;
    font-size:22px;
    line-height:1;
    cursor:pointer;
    z-index:2;
}

.tutorial-icon{
    width:60px;
    height:60px;
    border-radius:20px;
    background:rgba(159,205,217,0.14);
    border:1px solid rgba(159,205,217,0.20);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    margin-bottom:18px;
    position:relative;
    z-index:1;
}

.tutorial-title{
    font-size:23px;
    font-weight:900;
    line-height:1.35;
    letter-spacing:-0.035em;
    margin-bottom:12px;
    position:relative;
    z-index:1;
}

.tutorial-text{
    color:#dce3e6;
    font-size:15px;
    line-height:1.8;
    min-height:86px;
    position:relative;
    z-index:1;
}

.tutorial-dots{
    display:flex;
    justify-content:center;
    gap:8px;
    margin:24px 0 18px;
    position:relative;
    z-index:1;
}

.tutorial-dot{
    width:7px;
    height:7px;
    border-radius:999px;
    background:rgba(255,255,255,0.24);
    transition:0.2s ease;
}

.tutorial-dot.active{
    width:24px;
    background:#9fcdd9;
}

.tutorial-actions{
    display:flex;
    align-items:center;
    gap:10px;
    position:relative;
    z-index:1;
}

.tutorial-btn{
    appearance:none;
    -webkit-appearance:none;
    border:none;
    border-radius:999px;
    height:46px;
    padding:0 18px;
    font-family:inherit;
    font-size:14px;
    font-weight:900;
    cursor:pointer;

/* ============================================================
   PATCH 2026-06-11: 背景画像ループ + ぬるぬる移動
   - milkyway_bg.png を2枚重ねて縦方向に連続ループ
   - スクロール同期なしで自動アニメーションだけにする
   - 既存の milkywayPan / --milkyway-shift を最後で無効化
============================================================ */
:root{
    --galaxy-loop-y:0px;
    --galaxy-loop-height:140vh;
}

body::before{
    content:"" !important;
    position:fixed !important;
    left:0 !important;
    right:0 !important;
    top:-12vh !important;
    height:124vh !important;
    z-index:-3 !important;
    pointer-events:none !important;
    display:block !important;
    opacity:1 !important;
    transform:translate3d(0,0,0) !important;
    will-change:background-position !important;
    backface-visibility:hidden !important;
    background-image:
        linear-gradient(180deg, rgba(3,8,20,0.12) 0%, rgba(3,8,20,0.28) 42%, rgba(3,8,20,0.64) 100%),
        url("./milkyway_bg.png"),
        url("./milkyway_bg.png") !important;
    background-size:
        100% 100%,
        100% var(--galaxy-loop-height),
        100% var(--galaxy-loop-height) !important;
    background-position:
        center center,
        center var(--galaxy-loop-y),
        center calc(var(--galaxy-loop-y) + var(--galaxy-loop-height)) !important;
    background-repeat:
        no-repeat,
        no-repeat,
        no-repeat !important;
    background-attachment:scroll, scroll, scroll !important;
    animation:none !important;
    filter:saturate(1.08) brightness(0.94) contrast(1.08) !important;
}

body::after{
    z-index:-2 !important;
}

@media (max-width:900px){
    body::before{
        top:-14vh !important;
        height:128vh !important;
        background-size:
            100% 100%,
            100% var(--galaxy-loop-height),
            100% var(--galaxy-loop-height) !important;
        background-position:
            center center,
            center var(--galaxy-loop-y),
            center calc(var(--galaxy-loop-y) + var(--galaxy-loop-height)) !important;
        background-repeat:no-repeat, no-repeat, no-repeat !important;
        animation:none !important;
    }
}

@media (prefers-reduced-motion: reduce){
    body::before{
        background-position:
            center center,
            center top,
            center var(--galaxy-loop-height) !important;
    }
}

async function getPosterProfileForAlbum(album){
    const uid = album?.userId || "";

    if(uid && userProfileCache.has(uid)){
        return userProfileCache.get(uid);
    }

    const fallbackProfile = {
        name: album?.userName || album?.displayName || album?.nickname || "匿名ユーザー",
        iconUrl: album?.userIconUrl || album?.userPhotoURL || album?.photoURL || album?.avatarUrl || ""
    };

    if(uid){
        try{
            const userSnap = await getDoc(doc(db, "publicUsers", uid));

            if(userSnap.exists()){
                const userData = userSnap.data();
                const profile = {
                    name: getUserDisplayNameFromData(userData) || fallbackProfile.name,
                    iconUrl: getUserIconUrl(userData) || fallbackProfile.iconUrl
                };

                userProfileCache.set(uid, profile);
                return profile;
            }
        }catch(error){
            console.warn("投稿者プロフィールの取得に失敗しました", error);
        }
    }

    if(uid){
        userProfileCache.set(uid, fallbackProfile);
    }

    return fallbackProfile;
}

function getShareText(targetTypeOrId, maybeTargetId){

    const title = album.title || "Album Collectionの投稿";

}

function isHttpUrl(value){
    if(!value || typeof value !== "string"){
        return false;
    }

    try{
        const url = new URL(value);
        return url.protocol === "https:" || url.protocol === "http:";
    }catch(error){
        return false;
    }
}

function normalizeSpotifyType(value){
    const type = String(value || "").toLowerCase();

    if(type === "album"){
        return "album";
    }

    if(type === "playlist"){
        return "playlist";
    }

    if(type === "artist"){
        return "artist";
    }

    return "track";
}

function getSpotifyUrlFromId(album){
    const id = album?.spotifyId || album?.spotifyTrackId || album?.spotifyAlbumId || "";

    if(!id){
        return "";
    }

    const type = normalizeSpotifyType(album?.spotifyType || album?.type);
    return `https://open.spotify.com/${type}/${encodeURIComponent(id)}`;
}

function getSpotifyUrlFromUri(album){
    const uri =
        album?.spotifyUri ||
        album?.spotifyURI ||
        album?.spotifyTrackUri ||
        album?.spotifyAlbumUri ||
        "";

    if(!uri || typeof uri !== "string"){
        return "";
    }

    const parts = uri.split(":");

    if(parts.length < 3 || parts[0] !== "spotify"){
        return "";
    }

    const type = normalizeSpotifyType(parts[1]);
    const id = parts[2];

    if(!id){
        return "";
    }

    return `https://open.spotify.com/${type}/${encodeURIComponent(id)}`;
}

function getDirectMusicUrlForAlbum(album){
    const candidates = [
        album?.spotifyUrl,
        album?.spotifyURL,
        album?.spotifyLink,
        album?.spotifyTrackUrl,
        album?.spotifyTrackURL,
        album?.spotifyAlbumUrl,
        album?.spotifyAlbumURL,
        album?.appleMusicUrl,
        album?.appleMusicURL,
        album?.youtubeMusicUrl,
        album?.youtubeMusicURL,
        album?.musicUrl,
        album?.musicURL
    ];

    const directUrl = candidates.find(isHttpUrl);

    if(directUrl){
        return directUrl;
    }

    return getSpotifyUrlFromId(album) || getSpotifyUrlFromUri(album);
}

function getSpotifySearchUrlForAlbum(album){
    const queryText = [album?.title, album?.artist]
        .filter(Boolean)
        .join(" ");

    if(!queryText){
        return "https://open.spotify.com/search";
    }

    return `https://open.spotify.com/search/${encodeURIComponent(queryText)}`;
}

function getListenTitle(album){
    const title = album?.title || "この音楽";
    const artist = album?.artist ? ` / ${album.artist}` : "";
    return `${title}${artist}`;
}

const listenServiceLabels = [
    { key:"spotify", name:"Spotify", icon:"▶" },
    { key:"appleMusic", name:"Apple Music", icon:"♫" },
    { key:"lineMusic", name:"LINE MUSIC", icon:"♪" },
    { key:"youtubeMusic", name:"YouTube Music", icon:"▶" },
    { key:"amazonMusic", name:"Amazon Music", icon:"a" },
    { key:"awa", name:"AWA", icon:"A" },
    { key:"deezer", name:"Deezer", icon:"D" },
    { key:"tidal", name:"TIDAL", icon:"T" },
    { key:"soundcloud", name:"SoundCloud", icon:"☁" }
];

const priorityListenKeys = [
    "spotify",
    "appleMusic",
    "lineMusic",
    "youtubeMusic",
    "amazonMusic",
    "awa"
];

function getListenSearchQuery(album){
    return [album?.title, album?.artist]
        .filter(Boolean)
        .join(" ")
        .trim();
}

function buildServiceSearchUrl(serviceKey, queryText){
    const q = encodeURIComponent(queryText || "");

    if(!q){
        return "";
    }

    if(serviceKey === "appleMusic"){
        return `https://music.apple.com/search?term=${q}`;
    }

    if(serviceKey === "lineMusic"){
        return `https://music.line.me/webapp/search?query=${q}`;
    }

    if(serviceKey === "youtubeMusic"){
        return `https://music.youtube.com/search?q=${q}`;
    }

    if(serviceKey === "amazonMusic"){
        return `https://music.amazon.co.jp/search/${q}`;
    }

    if(serviceKey === "awa"){
        return `https://s.awa.fm/search?q=${q}`;
    }

    if(serviceKey === "spotify"){
        return `https://open.spotify.com/search/${q}`;
    }

    return "";
}

function getServiceLabelByKey(key){
    return listenServiceLabels.find(service => service.key === key) || null;
}

function createSearchFallbackServices(album, existingKeys = new Set()){
    const queryText = getListenSearchQuery(album);

    if(!queryText){
        return [];
    }

    return priorityListenKeys
        .filter(key => !existingKeys.has(key))
        .map((key) => {
            const label = getServiceLabelByKey(key);
            const url = buildServiceSearchUrl(key, queryText);

            if(!label || !url){
                return null;
            }

            return {
                key,
                name:`${label.name}で検索`,
                icon:label.icon,
                url
            };
        })
        .filter(Boolean);
}

function mergeUniqueServices(services){
    const seen = new Set();
    const result = [];

    services.forEach((service) => {
        if(!service?.url){
            return;
        }

        const uniqueKey = service.key || service.url;

        if(seen.has(uniqueKey)){
            return;
        }

        seen.add(uniqueKey);
        result.push(service);
    });

    return result;
}

function openUrlBlank(url){
    if(!url){

    window.open(url, "_blank", "noopener,noreferrer");
}

function renderListenActions(services){
    if(!listenActions){
        return;

    if(!services || services.length === 0){
        listenActions.innerHTML = `

    listenActions.innerHTML = services.map((service, index) => `
        <button
            type="button"
            class="listen-action-btn"
            data-listen-url="${escapeHTML(service.url)}"
            onclick="event.stopPropagation(); openListenService(${index});"
        >
            <span class="listen-action-name">
                <span class="listen-action-icon">${escapeHTML(service.icon || "♪")}</span>
                ${escapeHTML(service.name)}
            </span>
            <span class="listen-action-arrow">↗</span>
        </button>
    `).join("");

    window.currentListenServices = services;
}

function closeListenMenu(){

}

function openListenService(index){
    const services = window.currentListenServices || [];

    if(!service?.url){
        return;

}

async function openListenMenu(albumId){
    const item = getAlbumItemById(albumId);

    if(!item){
        return;
    }

    const album = item.data || {};
    const directUrl = getDirectMusicUrlForAlbum(album);
    const fallbackSpotifySearchUrl = getSpotifySearchUrlForAlbum(album);

    if(listenSheet){
        listenSheet.classList.add("open");
    }

    if(listenPanelSubtitle){
        listenPanelSubtitle.textContent = getListenTitle(album);
    }

    const existingKeys = new Set();
    const services = [];

    if(directUrl){
        existingKeys.add("spotify");

        services.push({
            key:"spotify",
            name:"Spotifyで開く",
            icon:"▶",
            url:directUrl
        });
    }

    const fallbackServices = createSearchFallbackServices(album, existingKeys);

    services.push(...fallbackServices);

    if(!directUrl && fallbackServices.length === 0){
        services.push({
            key:"spotifyFallback",
            name:"Spotifyで検索",
            icon:"▶",
            url:fallbackSpotifySearchUrl
        });
    }

    renderListenActions(mergeUniqueServices(services));
}

function openShareMenu(targetTypeOrId, maybeTargetId){

function loadImageForCanvas(src){
    return new Promise((resolve) => {
        if(!src){
            resolve(null);
            return;
        }

        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
    });
}

function roundRect(ctx, x, y, width, height, radius){
    const r = Math.min(radius, width / 2, height / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + width, y, x + width, y + height, r);
    ctx.arcTo(x + width, y + height, x, y + height, r);
    ctx.arcTo(x, y + height, x, y, r);
    ctx.arcTo(x, y, x + width, y, r);
    ctx.closePath();
}

function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight, maxLines){
    const chars = Array.from(String(text || ""));
    let line = "";
    let lines = [];

    for(const char of chars){
        const testLine = line + char;
        if(ctx.measureText(testLine).width > maxWidth && line){
            lines.push(line);
            line = char;
        }else{
            line = testLine;
        }
    }

    if(line){
        lines.push(line);
    }

    lines = lines.slice(0, maxLines);

    lines.forEach((lineText, index) => {
        const isLast = index === maxLines - 1 && lines.length === maxLines;
        let output = lineText;

        if(isLast && ctx.measureText(output).width > maxWidth){
            while(output.length > 0 && ctx.measureText(output + "…").width > maxWidth){
                output = output.slice(0, -1);
            }
            output += "…";
        }

        ctx.fillText(output, x, y + (index * lineHeight));
    });
}

function canvasToBlob(canvas){
    return new Promise((resolve) => {
        canvas.toBlob((blob) => resolve(blob), "image/png", 0.95);
    });
}

async function generateInstagramStoryImage(){
    if(selectedShareTargetType !== "album"){
        showShareToast("リストはリンク共有のみ対応しています");
        return;
    }

    if(!selectedShareTargetId){
        return;
    }

    const item = getAlbumItemById(selectedShareTargetId);
    if(!item){
        showShareToast("投稿データを取得できませんでした");
        return;
    }

    const album = item.data || {};
    const posterProfile = await getPosterProfileForAlbum(album);
    const canvas = document.createElement("canvas");
    canvas.width = 1080;
    canvas.height = 1920;

    const ctx = canvas.getContext("2d");

    function fillRoundRect(x, y, width, height, radius, color){
        ctx.save();
        roundRect(ctx, x, y, width, height, radius);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.restore();
    }

    function strokeRoundRect(x, y, width, height, radius, color, lineWidth = 1){
        ctx.save();
        roundRect(ctx, x, y, width, height, radius);
        ctx.strokeStyle = color;
        ctx.lineWidth = lineWidth;
        ctx.stroke();
        ctx.restore();
    }

    function splitWrappedLines(textValue, maxWidth, maxLines){
        const chars = Array.from(String(textValue || ""));
        let line = "";
        let lines = [];

        for(const char of chars){
            const testLine = line + char;
            if(ctx.measureText(testLine).width > maxWidth && line){
                lines.push(line);
                line = char;
            }else{
                line = testLine;
            }
        }

        if(line){
            lines.push(line);
        }

        if(lines.length > maxLines){
            lines = lines.slice(0, maxLines);
            let lastLine = lines[maxLines - 1];
            while(lastLine.length > 0 && ctx.measureText(lastLine + "…").width > maxWidth){
                lastLine = lastLine.slice(0, -1);
            }
            lines[maxLines - 1] = lastLine + "…";
        }

        return lines;
    }

    function drawCenteredWrappedText(textValue, centerX, topY, maxWidth, lineHeight, maxLines){
        const lines = splitWrappedLines(textValue, maxWidth, maxLines);
        lines.forEach((lineText, index) => {
            const width = ctx.measureText(lineText).width;
            ctx.fillText(lineText, centerX - (width / 2), topY + (index * lineHeight));
        });
        return lines.length;
    }

    function drawMeterRow(y, leftIcon, leftLabel, rightIcon, rightLabel, value){
        const safeValue = Math.max(1, Math.min(5, Number(value) || 3));
        const leftIconCenterX = 110;
        const leftLabelX = 144;
        const lineLeft = 272;
        const lineRight = 820;
        const rightIconCenterX = 876;
        const rightAreaRight = 980;
        const step = (lineRight - lineLeft) / 4;
        const selectedX = lineLeft + ((safeValue - 1) * step);

        ctx.save();
        ctx.fillStyle = "#f0d6a8";
        ctx.font = "700 34px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(leftIcon, leftIconCenterX, y);

        ctx.font = "700 30px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.fillText(rightIcon, rightIconCenterX, y);
        ctx.restore();

        ctx.fillStyle = "rgba(255,245,228,0.96)";
        ctx.font = "700 24px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "alphabetic";
        ctx.fillText(leftLabel, leftLabelX, y + 10);

        const rightWidth = ctx.measureText(rightLabel).width;
        ctx.fillText(rightLabel, rightAreaRight - rightWidth, y + 10);

        const lineGradient = ctx.createLinearGradient(lineLeft, y, lineRight, y);
        lineGradient.addColorStop(0, "rgba(102,136,186,0.82)");
        lineGradient.addColorStop(0.5, "rgba(205,208,215,0.74)");
        lineGradient.addColorStop(1, "rgba(246,155,107,0.90)");
        ctx.strokeStyle = lineGradient;
        ctx.lineWidth = 4;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(lineLeft, y);
        ctx.lineTo(lineRight, y);
        ctx.stroke();

        ctx.save();
        ctx.shadowColor = "rgba(255,255,255,0.42)";
        ctx.shadowBlur = 18;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(selectedX, y, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    function drawKeywordChip(textValue, x, y){
        const label = `#${String(textValue || "").replace(/^#+/, "")}`;
        ctx.font = "600 21px -apple-system, BlinkMacSystemFont, sans-serif";
        const width = Math.ceil(ctx.measureText(label).width) + 44;
        fillRoundRect(x, y, width, 54, 27, "rgba(20,22,25,0.42)");
        strokeRoundRect(x, y, width, 54, 27, "rgba(255,255,255,0.18)", 1.6);
        ctx.fillStyle = "rgba(255,255,255,0.95)";
        ctx.fillText(label, x + 22, y + 34);
        return width;
    }

    function getDisplayDescription(){
        return (
            album.desc ||
            album.description ||
            album.comment ||
            album.review ||
            "この音楽の魅力を、Album Collectionで記録しよう。"
        );
    }

    function getKeywordList(){
        return normalizeKeywords(album.keywords ?? []).filter(Boolean).slice(0, 4);
    }

    const coverImage = await loadImageForCanvas(album.cover || "");

    if(coverImage){
        try{
            ctx.save();
            ctx.filter = "blur(34px)";
            ctx.globalAlpha = 0.58;
            const scale = Math.max(canvas.width / coverImage.width, canvas.height / coverImage.height);
            const drawW = coverImage.width * scale;
            const drawH = coverImage.height * scale;
            const drawX = (canvas.width - drawW) / 2;
            const drawY = (canvas.height - drawH) / 2;
            ctx.drawImage(coverImage, drawX, drawY, drawW, drawH);
            ctx.restore();
        }catch(error){
            console.warn("背景画像の描画に失敗しました", error);
        }
    }

    const bgGradient = ctx.createLinearGradient(0, 0, 0, 1920);
    bgGradient.addColorStop(0, "rgba(40,30,18,0.16)");
    bgGradient.addColorStop(0.26, "rgba(15,18,24,0.30)");
    bgGradient.addColorStop(0.60, "rgba(9,12,17,0.60)");
    bgGradient.addColorStop(1, "rgba(5,7,10,0.92)");
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, 1080, 1920);

    const darkGradient = ctx.createLinearGradient(0, 220, 0, 1920);
    darkGradient.addColorStop(0, "rgba(255,255,255,0.00)");
    darkGradient.addColorStop(0.38, "rgba(8,11,16,0.24)");
    darkGradient.addColorStop(1, "rgba(5,7,10,0.72)");
    ctx.fillStyle = darkGradient;
    ctx.fillRect(0, 0, 1080, 1920);

    ctx.fillStyle = "rgba(255,255,255,0.34)";
    ctx.beginPath();
    ctx.arc(120, 84, 2.5, 0, Math.PI * 2);
    ctx.arc(212, 66, 1.8, 0, Math.PI * 2);
    ctx.arc(932, 145, 3.0, 0, Math.PI * 2);
    ctx.arc(845, 110, 2.0, 0, Math.PI * 2);
    ctx.fill();

    const coverSize = 540;
    const coverX = (1080 - coverSize) / 2;
    const coverY = 108;

    fillRoundRect(coverX - 6, coverY + 14, coverSize + 12, coverSize + 12, 36, "rgba(0,0,0,0.16)");

    ctx.save();
    roundRect(ctx, coverX, coverY, coverSize, coverSize, 34);
    ctx.clip();
    ctx.fillStyle = "rgba(255,255,255,0.94)";
    ctx.fillRect(coverX, coverY, coverSize, coverSize);

    if(coverImage){
        try{
            const sourceSize = Math.min(coverImage.width, coverImage.height);
            const sx = (coverImage.width - sourceSize) / 2;
            const sy = (coverImage.height - sourceSize) / 2;
            ctx.drawImage(coverImage, sx, sy, sourceSize, sourceSize, coverX, coverY, coverSize, coverSize);
        }catch(error){
            console.warn("ジャケット画像の描画に失敗しました", error);
            ctx.fillStyle = "#f5f1eb";
            ctx.fillRect(coverX, coverY, coverSize, coverSize);
        }
    }

    ctx.restore();
    strokeRoundRect(coverX, coverY, coverSize, coverSize, 34, "rgba(255,255,255,0.70)", 2.2);

    const centerX = 540;

    ctx.fillStyle = "#ffffff";
    ctx.font = "900 76px -apple-system, BlinkMacSystemFont, sans-serif";
    const titleTop = 760;
    const titleLineCount = drawCenteredWrappedText(album.title || "Untitled", centerX, titleTop, 770, 84, 2);

    const artistTop = titleTop + (titleLineCount * 84) + 12;
    ctx.fillStyle = "#f1d39b";
    ctx.font = "800 38px -apple-system, BlinkMacSystemFont, sans-serif";
    drawCenteredWrappedText(album.artist || "Unknown Artist", centerX, artistTop, 760, 48, 2);

    drawMeterRow(960, "☾", "暗い", "☼", "明るい", album.darkness);
    drawMeterRow(1032, "♪", "静か", "✹", "激しい", album.intense);
    drawMeterRow(1104, "◯", "シンプル", "◈", "複雑", album.complex);
    drawMeterRow(1176, "✩", "絶望", "✦", "希望", album.hope);
    drawMeterRow(1248, "◉", "個人", "◎", "世界", album.world);

    const description = getDisplayDescription();
    ctx.font = "500 25px -apple-system, BlinkMacSystemFont, sans-serif";
    const descLines = splitWrappedLines(description, 730, 4);
    const reviewBoxX = 92;
    const reviewBoxY = 1308;
    const reviewBoxW = 896;
    const reviewBoxH = Math.max(166, 62 + (descLines.length * 44));

    fillRoundRect(reviewBoxX, reviewBoxY, reviewBoxW, reviewBoxH, 32, "rgba(18,20,24,0.46)");
    strokeRoundRect(reviewBoxX, reviewBoxY, reviewBoxW, reviewBoxH, 32, "rgba(255,255,255,0.12)", 1.8);

    ctx.fillStyle = "rgba(255,255,255,0.96)";
    ctx.font = "500 25px -apple-system, BlinkMacSystemFont, sans-serif";
    descLines.forEach((lineText, index) => {
        ctx.fillText(lineText, 132, reviewBoxY + 62 + (index * 44));
    });

    const keywords = getKeywordList();
    let avatarY;

    if(keywords.length > 0){
        let chipX = 128;
        const chipY = reviewBoxY + reviewBoxH + 28;
        keywords.forEach((keyword) => {
            const width = drawKeywordChip(keyword, chipX, chipY);
            chipX += width + 16;
        });
        avatarY = chipY + 96;
    }else{
        avatarY = reviewBoxY + reviewBoxH + 38;
    }

    const avatarX = 188;
    const avatarSize = 70;
    const avatarImage = posterProfile?.iconUrl ? await loadImageForCanvas(posterProfile.iconUrl) : null;

    ctx.save();
    ctx.beginPath();
    ctx.arc(avatarX + (avatarSize / 2), avatarY + (avatarSize / 2), avatarSize / 2, 0, Math.PI * 2);
    ctx.clip();

    if(avatarImage){
        try{
            ctx.drawImage(avatarImage, avatarX, avatarY, avatarSize, avatarSize);
        }catch(error){
            console.warn("アバター描画に失敗しました", error);
            fillRoundRect(avatarX, avatarY, avatarSize, avatarSize, 35, "rgba(255,255,255,0.88)");
        }
    }else{
        fillRoundRect(avatarX, avatarY, avatarSize, avatarSize, 35, "rgba(255,255,255,0.88)");
        ctx.fillStyle = "#1d2430";
        ctx.font = "800 28px -apple-system, BlinkMacSystemFont, sans-serif";
        const initial = getInitialLetter(posterProfile?.name || "匿");
        const initialWidth = ctx.measureText(initial).width;
        ctx.fillText(initial, avatarX + (avatarSize / 2) - (initialWidth / 2), avatarY + 44);
    }

    ctx.restore();

    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(avatarX + (avatarSize / 2), avatarY + (avatarSize / 2), (avatarSize / 2) - 1, 0, Math.PI * 2);
    ctx.stroke();

    const displayName = posterProfile?.name || "music_lover";
    const handleBase = String(displayName)
        .trim()
        .replace(/^@+/, "")
        .replace(/\s+/g, "_")
        .replace(/[^a-zA-Z0-9_ぁ-んァ-ヶ一-龠]/g, "") || "music_lover";

    ctx.fillStyle = "rgba(255,255,255,0.98)";
    ctx.font = "500 27px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText(`by @${handleBase}`, 280, avatarY + 43);

    const logoCenterY = Math.min(avatarY + 154, 1852);
    ctx.strokeStyle = "rgba(255,255,255,0.95)";
    ctx.lineWidth = 6;
    ctx.lineCap = "round";
    const logoBaseX = 340;
    [24, 52, 78, 52, 24].forEach((height, index) => {
        const x = logoBaseX + (index * 18);
        ctx.beginPath();
        ctx.moveTo(x, logoCenterY - (height / 2));
        ctx.lineTo(x, logoCenterY + (height / 2));
        ctx.stroke();
    });

    ctx.fillStyle = "rgba(255,255,255,0.98)";
    ctx.font = "500 38px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText("Album Collection", 438, logoCenterY + 8);

    const blob = await canvasToBlob(canvas);

    if(!blob){
        showShareToast("画像生成に失敗しました");
        return;
    }

    const fileName = `album-collection-story-${selectedShareTargetId}.png`;
    const file = new File([blob], fileName, { type:"image/png" });

    if(navigator.canShare && navigator.canShare({ files:[file] }) && navigator.share){
        try{
            await navigator.share({
                files:[file],
                title:"Album Collection",
                text:"ストーリー用画像"
            });
            closeShareMenu();
            return;
        }catch(error){
            if(error?.name !== "AbortError"){
                console.warn("画像共有に失敗しました", error);
            }
        }
    }

    const objectUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = objectUrl;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(objectUrl);

    showShareToast("ストーリー用画像を生成しました");
    closeShareMenu();
}

async function notifyLike(db, currentUser, albumId){

    const albumSnap = await getDoc(doc(db, "albums", albumId));

    const albumData = albumSnap.data();

        fromUserId: currentUser.uid,
        fromUserName,
        type: "like",
        albumId,
        albumTitle: albumData.title || ""
    });
}

function formatPostDate(value){
    if(!value){
        return "";
    }

    let date = null;

    if(typeof value.toDate === "function"){
        date = value.toDate();
    } else if(value instanceof Date){
        date = value;
    } else if(typeof value === "number"){
        date = new Date(value);
    } else if(typeof value === "string"){
        const parsed = new Date(value);
        if(!Number.isNaN(parsed.getTime())){
            date = parsed;
        }
    }

    if(!date || Number.isNaN(date.getTime())){
        return "";
    }

    const now = new Date();
    const diffMs = now.getTime() - date.getTime();
    const diffMinutes = Math.floor(diffMs / 60000);
    const diffHours = Math.floor(diffMs / 3600000);
    const diffDays = Math.floor(diffMs / 86400000);

    if(diffMinutes < 1){
        return "今";
    }

    if(diffMinutes < 60){
        return `${diffMinutes}分前`;
    }

    if(diffHours < 24){
        return `${diffHours}時間前`;
    }

    if(diffDays < 7){
        return `${diffDays}日前`;
    }

    return `${date.getMonth() + 1}/${date.getDate()}`;
}

function meter(left, right, value){
    value = Number(value) || 0;
    value = Math.max(0, Math.min(5, value));

    const fillPercent = value <= 1 ? 0 : ((value - 1) / 4) * 100;

    let graphicHTML = "";

    for(let i = 1; i <= 5; i++){
        graphicHTML += `
            <div class="dot level-${i} ${i <= value ? "active" : ""} ${i === value ? "selected" : ""}"></div>
        `;

        if(i < 5){
            graphicHTML += `
                <div class="connector level-${i} ${i < value ? "active" : ""}"></div>
            `;
        }
    }

    return `
        <div class="meter">
            <div class="meter-label">${escapeHTML(left)}</div>
            <div class="meter-graphic meter-value-${value}" style="--meter-fill:${fillPercent}%;">${graphicHTML}</div>
            <div class="meter-label right-label">${escapeHTML(right)}</div>
        </div>
    `;
}

function getLikeId(userId, albumId){
    return `${userId}_${albumId}`;
}

function getAlbumCountValue(albumId, fieldNames){
    const item = getAlbumItemById(albumId);
    const album = item?.data || {};

    for(const fieldName of fieldNames){
        const value = album[fieldName];

        if(typeof value === "number"){
            return Math.max(0, value);
        }
    }

    return 0;
}

function getLikeCount(albumId){
    return getAlbumCountValue(albumId, ["likeCount", "likesCount"]);
}

function isLikedByMe(albumId){
    if(!currentUser) return false;

    return allLikes.some(like =>
        like.albumId === albumId &&
        like.userId === currentUser.uid
    );
}

function setupMyLikesListener(user){
    if(unsubscribeMyLikes){
        unsubscribeMyLikes();
        unsubscribeMyLikes = null;
    }

    allLikes = [];

    if(!user){
        updateLikeDisplays();
        return;
    }

    const myLikesQuery = query(
        collection(db, "likes"),
        where("userId", "==", user.uid)
    );

    unsubscribeMyLikes = onSnapshot(myLikesQuery, (snapshot) => {
        allLikes = [];

        snapshot.forEach((docSnap) => {
            allLikes.push(docSnap.data());
        });

        updateLikeDisplays();
    }, (error) => {
        console.warn("自分のいいね情報の取得に失敗しました", error);
        allLikes = [];
        updateLikeDisplays();
    });
}

async function toggleLike(albumId){
    if(!currentUser){
        location.href = `login.html?redirect=${encodeURIComponent(location.href)}`;
        return;
    }

    const likeId = getLikeId(currentUser.uid, albumId);
    const likeRef = doc(db, "likes", likeId);
    const albumRef = doc(db, "albums", albumId);

    if(isLikedByMe(albumId)){
        await deleteDoc(likeRef);
        await updateDoc(albumRef, {
            likeCount: increment(-1)
        });
    } else {
        await setDoc(likeRef, {
            userId: currentUser.uid,
            albumId: albumId,
            createdAt: serverTimestamp()
        });

        await updateDoc(albumRef, {
            likeCount: increment(1)
        });

        await notifyLike(db, currentUser, albumId);
    }
}

function updateLikeDisplays(){
    const likeAreas = document.querySelectorAll("[data-like-area]");

    likeAreas.forEach((area) => {
        const albumId = area.dataset.albumId;
        const countSpan = area.querySelector(".like-count");

function setupFollowingListener(user){
    if(unsubscribeFollowing){
        unsubscribeFollowing();
        unsubscribeFollowing = null;
    }

    followingIds = new Set();

    if(!user){
        renderAlbums();
        return;
    }

    const followQuery = query(
        collection(db, "follows"),
        where("followerId", "==", user.uid)
    );

    unsubscribeFollowing = onSnapshot(followQuery, (snapshot) => {
        followingIds = new Set();

        snapshot.forEach((docSnap) => {
            const follow = docSnap.data();
            if(follow.followingId){
                followingIds.add(follow.followingId);
            }
        });

        renderAlbums();
    }, (error) => {
        console.warn("フォロー情報の取得に失敗しました", error);
        followingIds = new Set();
        renderAlbums();
    });
}

function normalizeKeywords(value){
    if(Array.isArray(value)){
        return value
            .map(keyword => String(keyword ?? "").trim())
            .filter(Boolean);
    }

    if(typeof value === "string"){
        return value
            .split(/[\s,、#]+/)
            .map(keyword => keyword.trim())
            .filter(Boolean);
    }

    return [];
}

function renderKeywordTags(value){
    const keywords = normalizeKeywords(value);

    if(keywords.length === 0){
        return "";
    }

    return keywords.map((keyword) => {
        const safeKeyword = escapeHTML(keyword);
        const encodedKeyword = encodeURIComponent(keyword);

        return `
            <button
                type="button"
                class="keyword-tag"
                data-keyword="${encodedKeyword}"
            >#${safeKeyword}</button>
        `;
    }).join("");
}

function getSortedLists(){
    const items = [...allLists];

    if(currentSortMode === "new"){
        return items.sort((a, b) => getPostTime(b.data.createdAt || b.data.updatedAt) - getPostTime(a.data.createdAt || a.data.updatedAt));
    }

    if(currentSortMode.startsWith("popular_")){
        const period = currentSortMode.replace("popular_", "");
        return items
            .filter(item => isWithinPopularPeriod(item, period))
            .sort((a, b) => {
                const scoreDiff = getListPopularityScore(b) - getListPopularityScore(a);
                if(scoreDiff !== 0){
                    return scoreDiff;
                }
                return getPostTime(b.data.createdAt || b.data.updatedAt) - getPostTime(a.data.createdAt || a.data.updatedAt);
            });
    }

    return items.sort((a, b) => {
        const scoreDiff = getListSortScore(b) - getListSortScore(a);
        if(scoreDiff !== 0){
            return scoreDiff;
        }
        return getPostTime(b.data.createdAt || b.data.updatedAt) - getPostTime(a.data.createdAt || a.data.updatedAt);
    });
}

function normalizeTextForScore(value){
    return String(value ?? "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "")
        .replace(/[　・･\-_/／｜|]+/g, "");
}

function getFavoriteArtistNames(profile){
    if(!profile){
        return [];
    }

    const fromStrings = Array.isArray(profile.favoriteArtists)
        ? profile.favoriteArtists
        : [];

    const fromObjects = Array.isArray(profile.favoriteArtistObjects)
        ? profile.favoriteArtistObjects
            .map(artist => artist?.name || artist?.artistName || artist?.label || "")
        : [];

    return [...fromStrings, ...fromObjects]
        .map(name => String(name ?? "").trim())
        .filter(Boolean);
}

function getFavoriteTags(profile){
    if(!profile || !Array.isArray(profile.favoriteTags)){
        return [];
    }

    return profile.favoriteTags
        .map(tag => String(tag ?? "").trim())
        .filter(Boolean);
}

function getPopularScore(item){
    const albumId = item.id;
    const likeCount = getLikeCount(albumId);
    const commentCount = getCommentCount(albumId);

    // コメントは行動コストが高いので、いいねより少し重くする
    return likeCount + (commentCount * 2);
}

function getFreshnessScore(item){
    const postTime = getPostTime(item.data.createdAt || item.data.updatedAt);

    if(!postTime){
        return 0;
    }

    const ageHours = Math.max(0, (Date.now() - postTime) / 3600000);

    if(ageHours <= 24){
        return 18;
    }

    if(ageHours <= 72){
        return 10;
    }

    if(ageHours <= 168){
        return 5;
    }

    return 0;
}

function getRecommendScore(item){
    const album = item.data || {};
    let score = 0;

    const postArtist = normalizeTextForScore(album.artist || "");
    const postKeywords = normalizeKeywords(album.keywords)
        .map(keyword => normalizeTextForScore(keyword));

    const favoriteArtists = getFavoriteArtistNames(currentUserProfile)
        .map(name => normalizeTextForScore(name))
        .filter(Boolean);

    const favoriteTags = getFavoriteTags(currentUserProfile)
        .map(tag => normalizeTextForScore(tag))
        .filter(Boolean);

    favoriteArtists.forEach((artistName) => {
        if(postArtist && artistName && (postArtist.includes(artistName) || artistName.includes(postArtist))){
            score += 60;
        }
    });

    favoriteTags.forEach((tag) => {
        if(postKeywords.includes(tag)){
            score += 25;
        }
    });

    score += getPopularScore(item) * 4;
    score += getFreshnessScore(item);

    // おすすめ順では、自分の投稿が好み一致で上に来すぎないように少し下げる
    // 非表示にはせず、人気や新しさがあればある程度は上がれる
    if(currentUser && album.userId === currentUser.uid){
        score -= 180;
    }

    return score;
}

function isWithinPopularPeriod(item, period){
    if(period === "all"){
        return true;
    }

    const postTime = getPostTime(item.data.createdAt || item.data.updatedAt);

    if(!postTime){
        return false;
    }

    const diff = Date.now() - postTime;

    if(period === "24h"){
        return diff <= 24 * 60 * 60 * 1000;
    }

    if(period === "7d"){
        return diff <= 7 * 24 * 60 * 60 * 1000;
    }

    return true;
}

function getSortedAlbums(baseItems = allAlbums){
    const items = [...baseItems];

    if(currentSortMode === "new"){
        return items.sort((a, b) => {
            const aTime = getPostTime(a.data.createdAt || a.data.updatedAt);
            const bTime = getPostTime(b.data.createdAt || b.data.updatedAt);
            return bTime - aTime;
        });
    }

    if(currentSortMode.startsWith("popular_")){
        const period = currentSortMode.replace("popular_", "");

        return items
            .filter(item => isWithinPopularPeriod(item, period))
            .sort((a, b) => {
                const scoreDiff = getPopularScore(b) - getPopularScore(a);

                if(scoreDiff !== 0){
                    return scoreDiff;
                }

                const aTime = getPostTime(a.data.createdAt || a.data.updatedAt);
                const bTime = getPostTime(b.data.createdAt || b.data.updatedAt);
                return bTime - aTime;
            });
    }

    return items.sort((a, b) => {
        const scoreDiff = getRecommendScore(b) - getRecommendScore(a);

        if(scoreDiff !== 0){
            return scoreDiff;
        }

        const aTime = getPostTime(a.data.createdAt || a.data.updatedAt);
        const bTime = getPostTime(b.data.createdAt || b.data.updatedAt);
        return bTime - aTime;
    });
}

function getRecommendAlbums(){
    return getSortedAlbums(allAlbums);
}

function getFollowingAlbums(){
    if(!currentUser){
        return [];
    }

    const followingAlbums = allAlbums.filter((album) => {
        const userId = album.data.userId || "";
        return userId !== currentUser.uid && followingIds.has(userId);
    });

    return getSortedAlbums(followingAlbums);
}

function getFollowingLists(){
    if(!currentUser){
        return [];
    }

    return allLists.filter((list) => {
        const userId = list.data.userId || "";
        return userId !== currentUser.uid && followingIds.has(userId);
    });
}

function getFeedItemPopularScore(item){
    if(item.kind === "list"){
        return getListPopularityScore(item);
    }

    return getPopularScore(item);
}

function getFeedItemRecommendScore(item){
    if(item.kind === "list"){
        return (getFeedItemPopularScore(item) * 4) + getFreshnessScore(item);
    }

    return getRecommendScore(item);
}

function isFeedItemWithinPopularPeriod(item, period){
    return isWithinPopularPeriod(item, period);
}

function sortFeedItems(items){
    const cloned = [...items];

    if(currentSortMode === "new"){
        return cloned.sort((a, b) => getPostTime(b.data.createdAt || b.data.updatedAt) - getPostTime(a.data.createdAt || a.data.updatedAt));
    }

    if(currentSortMode.startsWith("popular_")){
        const period = currentSortMode.replace("popular_", "");
        return cloned
            .filter(item => isFeedItemWithinPopularPeriod(item, period))
            .sort((a, b) => {
                const scoreDiff = getFeedItemPopularScore(b) - getFeedItemPopularScore(a);
                if(scoreDiff !== 0){
                    return scoreDiff;
                }
                return getPostTime(b.data.createdAt || b.data.updatedAt) - getPostTime(a.data.createdAt || a.data.updatedAt);
            });
    }

    return cloned.sort((a, b) => {
        const scoreDiff = getFeedItemRecommendScore(b) - getFeedItemRecommendScore(a);
        if(scoreDiff !== 0){
            return scoreDiff;
        }
        return getPostTime(b.data.createdAt || b.data.updatedAt) - getPostTime(a.data.createdAt || a.data.updatedAt);
    });
}

function getFollowingFeedItems(){
    if(!currentUser){
        return [];
    }

    const albumItems = getFollowingAlbums().map(item => ({ ...item, kind:"album" }));
    const listItems = getFollowingLists().map(item => ({ ...item, kind:"list" }));
    return sortFeedItems([...albumItems, ...listItems]);
}

function getPostTime(value){
    if(!value){ return 0; }
    if(typeof value.toDate === "function"){ return value.toDate().getTime(); }
    if(value instanceof Date){ return value.getTime(); }
    if(typeof value === "number"){ return value; }
    if(typeof value === "string"){
        const parsed = new Date(value);
        if(!Number.isNaN(parsed.getTime())){ return parsed.getTime(); }
    }
    return 0;
}

function getFeedProgress(){
    if(!feedSwipe || window.innerWidth > 900){
        if(currentFeedMode === "list") return 2;
        if(currentFeedMode === "following") return 1;
        return 0;
    }

    return Math.max(0, Math.min(2, feedSwipe.scrollLeft / Math.max(1, feedSwipe.clientWidth)));
}

function updateFeedTabs(progress = null){
    if(!recommendTab || !followingTab || !listTab){
        return;
    }

    if(progress === null){
        progress = getFeedProgress();
    }

    progress = Math.max(0, Math.min(2, progress));

    let nextMode = "recommend";
    if(progress >= 1.5){
        nextMode = "list";
    }else if(progress >= 0.5){
        nextMode = "following";
    }

    currentFeedMode = nextMode;
    if(document.body){ document.body.dataset.feedMode = nextMode; }

    recommendTab.classList.toggle("active", nextMode === "recommend");
    followingTab.classList.toggle("active", nextMode === "following");
    listTab.classList.toggle("active", nextMode === "list");

    const tabs = document.getElementById("mobileFeedTabs");

    if(tabs){
        tabs.style.setProperty("--feed-progress", progress.toFixed(4));
        tabs.style.setProperty("--recommend-tab-opacity", String(1 - (Math.min(progress, 1) * 0.42)));
        tabs.style.setProperty("--following-tab-opacity", String(0.58 + ((1 - Math.min(1, Math.abs(progress - 1))) * 0.42)));
        tabs.style.setProperty("--list-tab-opacity", String(0.58 + (Math.max(0, progress - 1) * 0.42)));
    }

    const recommendPanel = document.querySelector('[data-feed-panel="recommend"]');
    const followingPanel = document.querySelector('[data-feed-panel="following"]');
    const listPanel = document.querySelector('[data-feed-panel="list"]');

    if(recommendPanel){
        recommendPanel.classList.toggle("is-visible", nextMode === "recommend");
    }

    if(followingPanel){
        followingPanel.classList.toggle("is-visible", nextMode === "following");
    }

    if(listPanel){
        listPanel.classList.toggle("is-visible", nextMode === "list");
    }
}

function scrollFeedTo(mode){
    if(mode !== "recommend" && mode !== "following" && mode !== "list"){
        return;
    }

    const panelIndex = mode === "list" ? 2 : (mode === "following" ? 1 : 0);

    currentFeedMode = mode;
    updateFeedTabs(panelIndex);

    if(feedSwipe && window.innerWidth <= 900){
        feedSwipe.scrollTo({
            left: feedSwipe.clientWidth * panelIndex,
            behavior:"smooth"
        });
    }
}

if(recommendTab){
    recommendTab.addEventListener("click", () => scrollFeedTo("recommend"));
}

if(followingTab){
    followingTab.addEventListener("click", () => scrollFeedTo("following"));
}

if(listTab){
    listTab.addEventListener("click", () => scrollFeedTo("list"));
}

function resetFeedToRecommendOnOpen(){
    if(!feedSwipe || window.innerWidth > 900){
        return;
    }

    currentFeedMode = "recommend";
    feedSwipe.scrollLeft = 0;
    updateFeedTabs(0);
}

window.addEventListener("pageshow", () => {
    requestAnimationFrame(resetFeedToRecommendOnOpen);
});

document.addEventListener("DOMContentLoaded", () => {
    requestAnimationFrame(resetFeedToRecommendOnOpen);
});

let feedScrollTicking = false;
let feedTouchStartX = 0;
let feedTouchStartY = 0;
let feedGestureDirection = null;
let unlockVerticalGestureTimer = null;

function lockFeedForVerticalGesture(){
    if(!feedSwipe){
        return;
    }

    feedSwipe.classList.add("vertical-gesture");
}

function unlockFeedGestureSoon(){
    if(!feedSwipe){
        return;
    }

    clearTimeout(unlockVerticalGestureTimer);

    unlockVerticalGestureTimer = setTimeout(() => {
        feedSwipe.classList.remove("vertical-gesture");
        feedGestureDirection = null;
    }, 180);
}

if(feedSwipe){
    feedSwipe.addEventListener("touchstart", (event) => {
        if(window.innerWidth > 900 || !event.touches || event.touches.length !== 1){
            return;
        }

        clearTimeout(unlockVerticalGestureTimer);
        feedSwipe.classList.remove("vertical-gesture");

        feedTouchStartX = event.touches[0].clientX;
        feedTouchStartY = event.touches[0].clientY;
        feedGestureDirection = null;
    }, { passive:true });

    feedSwipe.addEventListener("touchmove", (event) => {
        if(window.innerWidth > 900 || !event.touches || event.touches.length !== 1){
            return;
        }

        const dx = event.touches[0].clientX - feedTouchStartX;
        const dy = event.touches[0].clientY - feedTouchStartY;
        const absX = Math.abs(dx);
        const absY = Math.abs(dy);

        if(!feedGestureDirection && Math.max(absX, absY) > 8){
            feedGestureDirection = absY > absX + 6 ? "vertical" : "horizontal";

            if(feedGestureDirection === "vertical"){
                lockFeedForVerticalGesture();
            }
        }
    }, { passive:true });

    feedSwipe.addEventListener("touchend", unlockFeedGestureSoon, { passive:true });
    feedSwipe.addEventListener("touchcancel", unlockFeedGestureSoon, { passive:true });

    feedSwipe.addEventListener("scroll", () => {
        if(window.innerWidth > 900){
            return;
        }

        if(feedScrollTicking){
            return;
        }

        feedScrollTicking = true;

        requestAnimationFrame(() => {
            updateFeedTabs(getFeedProgress());
            feedScrollTicking = false;
        });
    }, { passive:true });
}

window.addEventListener("resize", () => {
    updateFeedTabs();
});

const sortModeLabels = {
    recommend: "おすすめ順",
    new: "新着順",
    popular_24h: "人気順：24時間",
    popular_7d: "人気順：7日間",
    popular_all: "人気順：全期間"
};

function getSortModeLabel(mode){
    return sortModeLabels[mode] || sortModeLabels.recommend;
}

function openSortMenu(){
    if(!sortFilterMenu || !sortFilterButton){
        return;
    }

    sortFilterMenu.classList.add("open");
    sortFilterButton.setAttribute("aria-expanded", "true");
}

function closeSortMenu(){
    if(!sortFilterMenu || !sortFilterButton){
        return;
    }

    sortFilterMenu.classList.remove("open");
    sortFilterButton.setAttribute("aria-expanded", "false");
}

function toggleSortMenu(){
    if(!sortFilterMenu){
        return;
    }

    if(sortFilterMenu.classList.contains("open")){
        closeSortMenu();
    }else{
        openSortMenu();
    }
}

function updateSortMenuUI(){
    if(sortFilterCurrentLabel){
        sortFilterCurrentLabel.textContent = `現在：${getSortModeLabel(currentSortMode)}`;
    }

    document.querySelectorAll("[data-sort-option]").forEach((button) => {
        const isActive = (button.dataset.sortMode || "") === currentSortMode;
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-pressed", isActive ? "true" : "false");
    });
}

function selectSortMode(mode){
    const nextMode = mode || "recommend";

    if(currentSortMode === nextMode){
        updateSortMenuUI();
        closeSortMenu();
        return;
    }

    currentSortMode = nextMode;
    updateSortMenuUI();
    closeSortMenu();
    renderAlbums();
}

if(sortFilterButton){
    sortFilterButton.addEventListener("click", (event) => {
        event.stopPropagation();
        toggleSortMenu();
    });
}

document.querySelectorAll("[data-sort-option]").forEach((button) => {
    button.addEventListener("click", (event) => {
        event.stopPropagation();
        selectSortMode(button.dataset.sortMode || "recommend");
    });
});

document.addEventListener("click", (event) => {
    if(!sortFilterMenu || !sortFilterButton){
        return;
    }

    const target = event.target;

    if(sortFilterMenu.contains(target) || sortFilterButton.contains(target)){
        return;
    }

    closeSortMenu();
});

document.addEventListener("keydown", (event) => {
    if(event.key === "Escape"){
        closeSortMenu();
    }
});

updateSortMenuUI();


function getObservationDetailUrl(item){
    if(item?.kind === "list"){
        return getListDetailUrl(item.id);
    }

    return `detail.html?id=${encodeURIComponent(item.id)}`;
}

function getObservationCoverUrl(item){
    const data = item?.data || {};

    if(item?.kind === "list"){
        const covers = Array.isArray(data.coverImages) ? data.coverImages.filter(Boolean) : [];
        return covers[0] || "";
    }

    return data.cover || data.imageUrl || data.jacketUrl || "";
}

function getObservationTitle(item){
    const data = item?.data || {};
    return data.title || (item?.kind === "list" ? "Untitled List" : "Untitled");
}

function getObservationArtist(item){
    const data = item?.data || {};

    if(item?.kind === "list"){
        const count = Number(data.itemCount || 0);
        return `${getListTypeLabel(data)}${count ? ` / ${count}曲入り` : ""}`;
    }

    return data.artist || "";
}

function getObservationText(item){
    const data = item?.data || {};
    return data.description || data.desc || data.review || data.comment || data.memo || "";
}

function getObservationAgeInfo(item){
    const postTime = getPostTime(item?.data?.createdAt || item?.data?.updatedAt);

    if(!postTime){
        return { postTime:0, diffHours:999999, label:"" };
    }

    const diffHours = Math.max(0, (Date.now() - postTime) / 3600000);
    return {
        postTime,
        diffHours,
        label:formatPostDate(item.data.createdAt || item.data.updatedAt)
    };
}

function getObservationSignalState(group){
    const latest = group?.latestDiffHours ?? 999999;
    const recentCount = group?.recentCount || 0;

    if(recentCount >= 2){
        return { className:"multiple", color:"#a970ff", label:String(recentCount) };
    }

    if(latest <= 6){
        return { className:"new", color:"#a970ff", label:"" };
    }

    if(latest <= 24){
        return { className:"recent", color:"#6ed8ff", label:"" };
    }

    return { className:"old", color:"#788194", label:"" };
}

function getObservationFeedItems(){
    if(!currentUser){
        return [];
    }

    const albumItems = getFollowingAlbums().map(item => ({ ...item, kind:"album" }));
    const listItems = getFollowingLists().map(item => ({ ...item, kind:"list" }));

    return [...albumItems, ...listItems]
        .sort((a, b) => getPostTime(b.data.createdAt || b.data.updatedAt) - getPostTime(a.data.createdAt || a.data.updatedAt));
}

async function buildObservationGroups(){
    const items = getObservationFeedItems();
    const groupMap = new Map();

    for(const item of items){
        const userId = item?.data?.userId || "unknown";
        const age = getObservationAgeInfo(item);
        const profile = await getPosterProfileForAlbum(item.data);

        if(!groupMap.has(userId)){
            groupMap.set(userId, {
                userId,
                profile,
                items:[],
                latestTime:0,
                latestDiffHours:999999,
                recentCount:0
            });
        }

        const group = groupMap.get(userId);
        group.items.push(item);
        group.latestTime = Math.max(group.latestTime, age.postTime);
        group.latestDiffHours = Math.min(group.latestDiffHours, age.diffHours);

        if(age.diffHours <= 24){
            group.recentCount += 1;
        }
    }

    return [...groupMap.values()]
        .filter(group => group.items.length > 0)
        .sort((a, b) => b.latestTime - a.latestTime)
        .slice(0, 7);
}

            <div class="observation-planet-name">${escapeHTML(name)}</div>
            <div class="observation-planet-time">${escapeHTML(timeLabel)}</div>

    `;
}

    progress.innerHTML = group.items.map((_, index) => {
        const className = index < activeObservationPostIndex ? "done" : (index === activeObservationPostIndex ? "active" : "");
        return `<div class="observation-progress-seg ${className}"><span></span></div>`;
    }).join("");
}

function openObservationGroup(groupIndex = 0, postIndex = 0){
    const viewer = document.getElementById("observationViewer");

    if(!viewer || observationGroups.length === 0){
        return;
    }

    activeObservationGroupIndex = Math.max(0, Math.min(observationGroups.length - 1, Number(groupIndex) || 0));
    const group = observationGroups[activeObservationGroupIndex];
    activeObservationPostIndex = Math.max(0, Math.min(group.items.length - 1, Number(postIndex) || 0));

    renderObservationViewer();
    viewer.classList.add("open");
    viewer.setAttribute("aria-hidden", "false");
}

function nextObservationPost(){
    const group = observationGroups[activeObservationGroupIndex];
    if(!group){ return; }

    if(activeObservationPostIndex < group.items.length - 1){
        activeObservationPostIndex += 1;
    }else if(activeObservationGroupIndex < observationGroups.length - 1){
        activeObservationGroupIndex += 1;
        activeObservationPostIndex = 0;
    }else{
        activeObservationGroupIndex = 0;
        activeObservationPostIndex = 0;
    }

    renderObservationViewer();
}

function prevObservationPost(){
    if(activeObservationPostIndex > 0){
        activeObservationPostIndex -= 1;
    }else if(activeObservationGroupIndex > 0){
        activeObservationGroupIndex -= 1;
        const group = observationGroups[activeObservationGroupIndex];
        activeObservationPostIndex = Math.max(0, group.items.length - 1);
    }else{
        activeObservationGroupIndex = observationGroups.length - 1;
        const group = observationGroups[activeObservationGroupIndex];
        activeObservationPostIndex = Math.max(0, group.items.length - 1);

/* ============================================================
   DAILY METEOR V1 2026-06-11
   - ホームに「知らない人の投稿が毎日1件届く」機能を追加
   - 新規投稿形式は増やさず、既存の albums / lists から1件選ぶ
============================================================ */

function getDailyMeteorDateKey(){
    try{
        return new Intl.DateTimeFormat("sv-SE", { timeZone:"Asia/Tokyo", year:"numeric", month:"2-digit", day:"2-digit" }).format(new Date());
    }catch(error){
        return new Date().toISOString().slice(0, 10);
    }
}

function hashDailyMeteorSeed(text){
    let hash = 2166136261;
    const source = String(text || "");
    for(let i = 0; i < source.length; i++){
        hash ^= source.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
    }
    return Math.abs(hash >>> 0);
}

function getDailyMeteorCandidates(){
    const albumItems = (allAlbums || []).map(item => ({ ...item, kind:"album" }));
    const listItems = (allLists || []).map(item => ({ ...item, kind:"list" }));

    return [...albumItems, ...listItems]
        .filter(item => {
            const userId = item?.data?.userId || "";
            if(!userId){ return false; }
            if(currentUser && userId === currentUser.uid){ return false; }
            if(followingIds && followingIds.has(userId)){ return false; }
            return true;
        })
        .sort((a, b) => {
            const timeA = getPostTime(a.data.createdAt || a.data.updatedAt);
            const timeB = getPostTime(b.data.createdAt || b.data.updatedAt);
            return timeB - timeA;
        })
        .slice(0, 80);
}

function selectDailyMeteorItem(candidates){
    if(!candidates.length){ return null; }

    const dateKey = getDailyMeteorDateKey();
    const userKey = currentUser?.uid || "guest";
    const storageKey = `albumCollectionDailyMeteor:${userKey}`;

    try{
        const saved = JSON.parse(localStorage.getItem(storageKey) || "null");
        if(saved?.dateKey === dateKey){
            const savedItem = candidates.find(item => item.kind === saved.kind && item.id === saved.id);
            if(savedItem){ return savedItem; }
        }
    }catch(error){
        // localStorageが使えない環境では、その場で日付ベース選定に戻す
    }

    const seed = `${dateKey}:${userKey}:${candidates.map(item => `${item.kind}:${item.id}`).join("|")}`;
    const selected = candidates[hashDailyMeteorSeed(seed) % candidates.length];

    try{
        localStorage.setItem(storageKey, JSON.stringify({
            dateKey,
            kind:selected.kind,
            id:selected.id
        }));
    }catch(error){
        // 保存できなくても表示自体は続ける
    }

    return selected;
}

function getDailyMeteorSnippet(item){
    const text = getObservationText(item);
    if(text){ return text; }
    return "知らない誰かの音楽ログが、1日1件だけ届きます。";
}

function dailyMeteorCoverHTML(item){
    const coverUrl = getObservationCoverUrl(item);
    if(coverUrl){
        return `<img src="${escapeHTML(coverUrl)}" alt="">`;
    }
    return `<div class="daily-meteor-cover-fallback">✦</div>`;
}

async function renderDailyMeteor(){
    if(!dailyMeteorBox){ return; }

    const candidates = getDailyMeteorCandidates();
    const item = selectDailyMeteorItem(candidates);
    dailyMeteorItem = item;

    if(!item){

            </span>

<script>
/* 背景画像を縦ループで自動アニメーションさせる。スクロール同期はしない */
(function(){
    const BG_SRC = "./milkyway_bg.png";
    const BASE_SPEED = 8; // 背景が流れる速度 px/秒。遅くしたいなら 5〜6、速くしたいなら 10〜12

    const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduceMotion){
        return;
    }

    let loopHeight = Math.max(window.innerHeight * 1.4, 900);
    let lastTime = performance.now();
    let autoY = 0;
    let imageRatio = 1.45;

    function setLoopHeight(){
        const naturalHeight = Math.max(window.innerWidth * imageRatio, window.innerHeight * 1.35);
        loopHeight = Math.ceil(naturalHeight);
        document.documentElement.style.setProperty("--galaxy-loop-height", `${loopHeight}px`);
    }

    function loadBackgroundRatio(){
        const img = new Image();
        img.onload = () => {
            if(img.naturalWidth && img.naturalHeight){
                imageRatio = img.naturalHeight / img.naturalWidth;
                setLoopHeight();
            }
        };
        img.src = BG_SRC;
    }

    function tick(now){
        const dt = Math.min(64, now - lastTime) / 1000;
        lastTime = now;

        autoY = (autoY + BASE_SPEED * dt) % loopHeight;
        document.documentElement.style.setProperty("--galaxy-loop-y", `${-autoY}px`);

        requestAnimationFrame(tick);
    }

    window.addEventListener("resize", setLoopHeight, { passive:true });
    window.addEventListener("orientationchange", () => {
        setTimeout(setLoopHeight, 180);
    }, { passive:true });

    document.addEventListener("DOMContentLoaded", () => {
        setLoopHeight();
        loadBackgroundRatio();
        requestAnimationFrame(tick);
    });
})();
