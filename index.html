/* ============================================================
   PATCH OBSERVATION V5 JS 2026-06-11
   - 横スクロール型フィードを停止して、タップ切替だけにする
   - 観測タブで縦スワイプしても「おすすめ」に戻らないようにする
   - 観測ビューア左右タップのダブルタップ拡大を防ぐ
============================================================ */
(function(){
    function feedModeToIndex(mode){
        if(mode === "list") return 2;
        if(mode === "following") return 1;
        return 0;
    }

    function indexToFeedMode(index){
        if(index >= 1.5) return "list";
        if(index >= 0.5) return "following";
        return "recommend";
    }

    window.getFeedProgress = function(){
        return feedModeToIndex(currentFeedMode);
    };

    window.updateFeedTabs = function(progress = null){
        if(!recommendTab || !followingTab || !listTab){
            return;
        }

        let nextMode = currentFeedMode || "recommend";

        if(typeof progress === "number"){
            nextMode = indexToFeedMode(progress);
        }

        if(nextMode !== "recommend" && nextMode !== "following" && nextMode !== "list"){
            nextMode = "recommend";
        }

        currentFeedMode = nextMode;
        if(document.body){ document.body.dataset.feedMode = nextMode; }

        const panelIndex = feedModeToIndex(nextMode);
        const tabs = document.getElementById("mobileFeedTabs");

        recommendTab.classList.toggle("active", nextMode === "recommend");
        followingTab.classList.toggle("active", nextMode === "following");
        listTab.classList.toggle("active", nextMode === "list");

        if(tabs){
            tabs.dataset.activeFeed = nextMode;
            tabs.style.setProperty("--feed-progress", String(panelIndex));
            tabs.style.setProperty("--recommend-tab-opacity", nextMode === "recommend" ? "1" : "0.58");
            tabs.style.setProperty("--following-tab-opacity", nextMode === "following" ? "1" : "0.58");
            tabs.style.setProperty("--list-tab-opacity", nextMode === "list" ? "1" : "0.58");
        }

        const recommendPanel = document.querySelector('[data-feed-panel="recommend"]');
        const followingPanel = document.querySelector('[data-feed-panel="following"]');
        const listPanel = document.querySelector('[data-feed-panel="list"]');

        if(recommendPanel){
            recommendPanel.classList.toggle("is-visible", nextMode === "recommend");
        }

        if(followingPanel){
            followingPanel.classList.toggle("is-visible", nextMode === "following");
        }

        if(listPanel){
            listPanel.classList.toggle("is-visible", nextMode === "list");
        }

        if(feedSwipe && window.innerWidth <= 900 && feedSwipe.scrollLeft !== 0){
            feedSwipe.scrollLeft = 0;
        }
    };

    window.scrollFeedTo = function(mode){
        if(mode !== "recommend" && mode !== "following" && mode !== "list"){
            return;
        }

        currentFeedMode = mode;

        if(feedSwipe && window.innerWidth <= 900){
            feedSwipe.classList.remove("vertical-gesture");
            feedSwipe.scrollLeft = 0;
        }

        updateFeedTabs(feedModeToIndex(mode));
    };

    window.resetFeedToRecommendOnOpen = function(){
        if(window.innerWidth > 900){
            return;
        }

        currentFeedMode = "recommend";

        if(feedSwipe){
            feedSwipe.classList.remove("vertical-gesture");
            feedSwipe.scrollLeft = 0;
        }

        updateFeedTabs(0);
    };

    function setupObservationTapZones(){
        const viewer = document.getElementById("observationViewer");
        const leftZone = document.getElementById("prevStory");
        const rightZone = document.getElementById("nextStory");
        const leftObservationZone = document.querySelector(".observation-tap-zone.left");
        const rightObservationZone = document.querySelector(".observation-tap-zone.right");
        const zones = [
            { el:leftZone || leftObservationZone, fn:() => prevObservationPost() },
            { el:rightZone || rightObservationZone, fn:() => nextObservationPost() }
        ];

        if(viewer){
            viewer.addEventListener("dblclick", (event) => {
                event.preventDefault();
                event.stopPropagation();
            }, { passive:false });

            viewer.addEventListener("gesturestart", (event) => {
                event.preventDefault();
            }, { passive:false });
        }

        zones.forEach(({el, fn}) => {
            if(!el || el.dataset.observationTapFixed === "1"){
                return;
            }

            el.dataset.observationTapFixed = "1";
            el.removeAttribute("onclick");
            el.onclick = null;

            let lastTapAt = 0;

            const handleTap = (event) => {
                event.preventDefault();
                event.stopPropagation();

                const now = Date.now();
                if(now - lastTapAt < 110){
                    return;
                }
                lastTapAt = now;

                fn();
            };

            if("PointerEvent" in window){
                el.addEventListener("pointerup", handleTap, { passive:false });
            }else{
                el.addEventListener("touchend", handleTap, { passive:false });
                el.addEventListener("click", handleTap, { passive:false });
            }
        });
    }

    function setupTapOnlyFeedTabs(){
        if(feedSwipe && window.innerWidth <= 900){
            feedSwipe.classList.remove("vertical-gesture");
            feedSwipe.scrollLeft = 0;
        }

        updateFeedTabs(feedModeToIndex(currentFeedMode || "recommend"));
        setupObservationTapZones();
    }

    document.addEventListener("DOMContentLoaded", () => {
        requestAnimationFrame(setupTapOnlyFeedTabs);
    });

    window.addEventListener("pageshow", () => {
        requestAnimationFrame(setupTapOnlyFeedTabs);
    });

    window.addEventListener("resize", () => {
        requestAnimationFrame(setupTapOnlyFeedTabs);
    });

    setupTapOnlyFeedTabs();
})();

/* ============================================================
   PATCH FINAL CLEAN JS 2026-06-12
   - 流れ星バナーが feed-panel 内に戻っても body 直下へ逃がす
   - 現在のタブ状態を body[data-feed-mode] に同期
============================================================ */
(function(){
    function syncMeteorAndFeedMode(){
        const box = document.getElementById("dailyMeteorBox");
        const topbar = document.querySelector(".topbar");
        const swipe = document.getElementById("feedSwipe");

        if(box && box.parentElement && box.parentElement.closest(".feed-panel")){
            if(swipe){
                swipe.parentNode.insertBefore(box, swipe);
            }else if(topbar && topbar.parentNode){
                topbar.parentNode.insertBefore(box, topbar.nextSibling);
            }else{
                document.body.prepend(box);
            }
        }

        const mode = (window.currentFeedMode || document.getElementById("mobileFeedTabs")?.dataset?.activeFeed || "recommend");
        document.body.dataset.feedMode = mode;
    }

    const originalUpdateFeedTabs = window.updateFeedTabs;
    if(typeof originalUpdateFeedTabs === "function"){
        window.updateFeedTabs = function(){
            const result = originalUpdateFeedTabs.apply(this, arguments);
            syncMeteorAndFeedMode();
            return result;
        };
    }

    document.addEventListener("DOMContentLoaded", () => {
        syncMeteorAndFeedMode();
        requestAnimationFrame(syncMeteorAndFeedMode);
    });

    window.addEventListener("pageshow", () => requestAnimationFrame(syncMeteorAndFeedMode));
    window.addEventListener("resize", () => requestAnimationFrame(syncMeteorAndFeedMode));
})();

/* ============================================================
   PATCH MOBILE FEED NAV V2 JS 2026-06-12
   - タップ固定化パッチの後から、左右スワイプ切替を復活
   - スクロール方向で上部ロゴ/タブを隠す・戻す
============================================================ */
(function(){
    const modes = ["recommend", "following", "list"];
    const swipe = document.getElementById("feedSwipe");
    const tabs = document.getElementById("mobileFeedTabs");
    const tabButtons = {
        recommend:document.getElementById("recommendTab"),
        following:document.getElementById("followingTab"),
        list:document.getElementById("listTab")
    };

    function modeToIndex(mode){
        return mode === "list" ? 2 : (mode === "following" ? 1 : 0);
    }

    function indexToMode(index){
        if(index >= 1.5){ return "list"; }
        if(index >= 0.5){ return "following"; }
        return "recommend";
    }

    function getProgress(){
        if(!swipe || window.innerWidth > 900){
            return modeToIndex(window.currentFeedMode || document.body?.dataset?.feedMode || "recommend");
        }

        return Math.max(0, Math.min(2, swipe.scrollLeft / Math.max(1, swipe.clientWidth)));
    }

    function setActiveFeed(mode, progress = null){
        if(!modes.includes(mode)){
            mode = "recommend";
        }

        window.currentFeedMode = mode;
        document.body.dataset.feedMode = mode;

        const activeIndex = modeToIndex(mode);
        const underlineProgress = typeof progress === "number" ? Math.max(0, Math.min(2, progress)) : activeIndex;

        Object.entries(tabButtons).forEach(([key, button]) => {
            if(!button){ return; }
            button.classList.toggle("active", key === mode);
            button.setAttribute("aria-selected", key === mode ? "true" : "false");
        });

        if(tabs){
            tabs.dataset.activeFeed = mode;
            tabs.style.setProperty("--feed-progress", underlineProgress.toFixed(4));
            tabs.style.setProperty("--recommend-tab-opacity", mode === "recommend" ? "1" : "0.58");
            tabs.style.setProperty("--following-tab-opacity", mode === "following" ? "1" : "0.58");
            tabs.style.setProperty("--list-tab-opacity", mode === "list" ? "1" : "0.58");
        }

        document.querySelectorAll("[data-feed-panel]").forEach((panel) => {
            panel.classList.toggle("is-visible", panel.dataset.feedPanel === mode);
        });
    }

    function updateFromSwipe(){
        const progress = getProgress();
        setActiveFeed(indexToMode(progress), progress);
    }

    function goToFeed(mode, smooth = true){
        if(!modes.includes(mode)){
            mode = "recommend";
        }

        setActiveFeed(mode, modeToIndex(mode));

        if(swipe && window.innerWidth <= 900){
            swipe.classList.remove("vertical-gesture");
            swipe.scrollTo({
                left:swipe.clientWidth * modeToIndex(mode),
                behavior:smooth ? "smooth" : "auto"
            });
        }
    }

    window.getFeedProgress = getProgress;
    window.updateFeedTabs = function(progress = null){
        if(typeof progress === "number"){
            setActiveFeed(indexToMode(progress), progress);
        }else{
            updateFromSwipe();
        }
    };
    window.scrollFeedTo = goToFeed;

    Object.entries(tabButtons).forEach(([mode, button]) => {
        if(!button){ return; }

        button.addEventListener("click", (event) => {
            event.preventDefault();
            event.stopImmediatePropagation();
            goToFeed(mode);
        }, true);
    });

    if(swipe){
        let ticking = false;

        swipe.addEventListener("scroll", () => {
            if(window.innerWidth > 900 || ticking){
                return;
            }

            ticking = true;
            requestAnimationFrame(() => {
                updateFromSwipe();
                ticking = false;
            });
        }, { passive:true });
    }

    let lastY = window.scrollY || 0;
    let headTicking = false;

    function syncHeaderVisibility(){
        if(window.innerWidth > 900){
            document.body.classList.remove("mobile-head-hidden");
            return;
        }

        const currentY = window.scrollY || document.documentElement.scrollTop || 0;
        const diff = currentY - lastY;

        if(currentY < 24 || diff < -8){
            document.body.classList.remove("mobile-head-hidden");
        }else if(diff > 10 && currentY > 84){
            document.body.classList.add("mobile-head-hidden");
        }

        lastY = currentY;
    }

    window.addEventListener("scroll", () => {
        if(headTicking){
            return;
        }

        headTicking = true;
        requestAnimationFrame(() => {
            syncHeaderVisibility();
            headTicking = false;
        });
    }, { passive:true });

    function boot(){
        if(swipe && window.innerWidth <= 900){
            const mode = window.currentFeedMode || document.body?.dataset?.feedMode || "recommend";
            goToFeed(mode, false);
        }else{
            setActiveFeed(window.currentFeedMode || document.body?.dataset?.feedMode || "recommend");
        }
        syncHeaderVisibility();
    }

    document.addEventListener("DOMContentLoaded", () => requestAnimationFrame(boot));
    window.addEventListener("pageshow", () => requestAnimationFrame(boot));
    window.addEventListener("resize", () => requestAnimationFrame(boot));
    boot();
})();


</script>
