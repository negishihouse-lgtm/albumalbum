<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Album Collection - Story Mode</title>

<style>
:root{
  --bg:#030611;
  --text:#f6f2ff;
  --muted:rgba(246,242,255,.55);
  --line:rgba(255,255,255,.12);
  --panel:rgba(8,10,22,.55);
  --panel2:rgba(17,14,35,.72);
  --purple:#a66cff;
  --purple2:#d09bff;
  --cyan:#78d9ff;
  --old:#7d8598;
  --danger:#ff6b8a;
  --radius:28px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:#02040c;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif;
  overflow:hidden;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

button{
  font:inherit;
  color:inherit;
  border:0;
  background:none;
  cursor:pointer;
}

.app-shell{
  width:min(430px,100vw);
  height:min(932px,100dvh);
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 52% 43%, rgba(255,204,188,.95) 0 2px, transparent 9px),
    radial-gradient(circle at 52% 43%, rgba(255,188,137,.45) 0 2%, transparent 11%),
    radial-gradient(ellipse at 56% 41%, rgba(255,146,196,.32) 0%, rgba(115,79,255,.18) 18%, transparent 42%),
    radial-gradient(circle at 28% 29%, rgba(152,72,255,.20), transparent 18%),
    radial-gradient(circle at 75% 35%, rgba(72,207,255,.16), transparent 19%),
    linear-gradient(180deg,#02040b 0%,#060817 48%,#030713 100%);
  border-radius:0;
  box-shadow:0 0 80px rgba(0,0,0,.65);
}

.app-shell::before{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    radial-gradient(circle, rgba(255,255,255,.95) 0 1px, transparent 1.5px),
    radial-gradient(circle, rgba(174,129,255,.8) 0 1px, transparent 1.5px),
    radial-gradient(circle, rgba(125,223,255,.75) 0 1px, transparent 1.5px);
  background-size:54px 54px, 91px 91px, 137px 137px;
  background-position:0 0, 17px 22px, 43px 11px;
  opacity:.42;
  pointer-events:none;
}

.app-shell::after{
  content:"";
  position:absolute;
  inset:-10%;
  background:
    radial-gradient(ellipse at center, transparent 0 28%, rgba(0,0,0,.18) 52%, rgba(0,0,0,.72) 100%);
  pointer-events:none;
}

.statusbar{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:42px;
  z-index:5;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  font-weight:800;
  letter-spacing:.02em;
  text-shadow:0 0 10px rgba(255,255,255,.4);
}

.status-icons{
  display:flex;
  gap:7px;
  align-items:center;
  font-size:13px;
}

.header{
  position:absolute;
  z-index:5;
  top:42px;
  left:0;
  right:0;
  padding:20px 18px 0;
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.title{
  font-size:25px;
  font-weight:850;
  letter-spacing:-.04em;
  margin:0;
  text-shadow:0 0 18px rgba(255,255,255,.35);
}

.header-actions{
  display:flex;
  align-items:center;
  gap:13px;
}

.icon-btn{
  width:42px;
  height:42px;
  border-radius:999px;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(5,8,18,.25);
  backdrop-filter:blur(16px);
  box-shadow:inset 0 0 18px rgba(255,255,255,.03);
}

.icon-btn svg{
  width:23px;
  height:23px;
  stroke:rgba(255,255,255,.88);
  stroke-width:2;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.profile-planet{
  width:46px;
  height:46px;
  position:relative;
  border-radius:50%;
  background:
    radial-gradient(circle at 68% 28%, #8e62ff 0 5%, transparent 7%),
    radial-gradient(circle at 35% 35%, #526eff 0%, #192b69 44%, #060b22 78%);
  box-shadow:
    0 0 20px rgba(143,105,255,.65),
    inset -12px -14px 20px rgba(0,0,0,.55);
}

.profile-planet::after{
  content:"";
  position:absolute;
  top:-2px;
  right:-2px;
  width:9px;
  height:9px;
  background:var(--purple);
  border-radius:50%;
  box-shadow:0 0 10px var(--purple);
}

.tabs{
  margin-top:18px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-bottom:1px solid rgba(255,255,255,.1);
}

.tab{
  position:relative;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  color:rgba(255,255,255,.45);
  font-size:14px;
  font-weight:800;
  letter-spacing:-.03em;
  text-shadow:0 0 10px rgba(0,0,0,.5);
}

.tab.active{
  color:#f1e8ff;
}

.tab.active::after{
  content:"";
  position:absolute;
  left:15%;
  right:15%;
  bottom:-1px;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--purple),var(--purple2),transparent);
  box-shadow:0 0 14px var(--purple);
  border-radius:99px;
}

.tab svg{
  width:22px;
  height:22px;
  stroke:currentColor;
  stroke-width:2;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
  filter:drop-shadow(0 0 8px rgba(166,108,255,.35));
}

.main{
  position:absolute;
  z-index:2;
  inset:158px 0 86px;
  overflow:hidden;
}

.section-head{
  position:absolute;
  top:22px;
  left:18px;
  right:18px;
  z-index:3;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}

.section-title{
  margin:0;
  font-size:18px;
  font-weight:850;
  letter-spacing:-.05em;
}

.section-sub{
  margin:6px 0 0;
  color:var(--muted);
  font-size:13px;
  font-weight:700;
}

.new-signal-btn{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 13px;
  border-radius:999px;
  border:1px solid rgba(166,108,255,.42);
  background:rgba(95,45,154,.28);
  color:#d9b7ff;
  font-size:13px;
  font-weight:900;
  box-shadow:
    0 0 18px rgba(166,108,255,.25),
    inset 0 0 22px rgba(166,108,255,.12);
}

.new-signal-btn svg{
  width:20px;
  height:20px;
  stroke:currentColor;
  stroke-width:2;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.galaxy-map{
  position:absolute;
  inset:0;
  z-index:1;
}

.orbit{
  position:absolute;
  border:1px dashed rgba(203,210,255,.16);
  border-radius:50%;
  transform:rotate(var(--rotate));
  filter:drop-shadow(0 0 9px rgba(128,91,255,.12));
  pointer-events:none;
}

.orbit.one{
  width:520px;
  height:220px;
  left:-68px;
  top:180px;
  --rotate:-14deg;
}

.orbit.two{
  width:390px;
  height:170px;
  left:28px;
  top:330px;
  --rotate:5deg;
}

.orbit.three{
  width:470px;
  height:210px;
  left:-28px;
  top:465px;
  --rotate:-8deg;
}

.story-planet{
  position:absolute;
  left:var(--x);
  top:var(--y);
  width:var(--size);
  transform:translate(-50%,-50%);
  text-align:center;
  z-index:2;
}

.planet-button{
  position:relative;
  width:var(--size);
  height:var(--size);
  border-radius:50%;
  display:block;
  margin:0 auto;
  background:var(--planet-bg);
  box-shadow:
    0 0 22px var(--glow),
    0 0 45px color-mix(in srgb, var(--glow), transparent 55%),
    inset -20px -22px 25px rgba(0,0,0,.62),
    inset 8px 8px 18px rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.12);
  overflow:visible;
}

.planet-button::before{
  content:"";
  position:absolute;
  inset:45% -20%;
  height:11px;
  border:1px solid rgba(195,210,255,.16);
  border-left-color:transparent;
  border-right-color:transparent;
  border-radius:50%;
  transform:rotate(-16deg);
  box-shadow:0 0 12px rgba(255,255,255,.08);
}

.planet-button::after{
  content:"";
  position:absolute;
  inset:-8px;
  border-radius:50%;
  background:
    radial-gradient(circle at 22% 18%, rgba(255,255,255,.75) 0 1px, transparent 2px),
    radial-gradient(circle at 70% 42%, rgba(255,255,255,.38) 0 1px, transparent 2px);
  opacity:.58;
}

.signal-dot{
  position:absolute;
  right:-8px;
  top:8px;
  width:18px;
  height:18px;
  border-radius:50%;
  background:var(--dot);
  box-shadow:0 0 16px var(--dot);
  z-index:4;
}

.signal-dot.multiple{
  width:24px;
  height:24px;
  display:grid;
  place-items:center;
  font-size:12px;
  font-weight:950;
  color:#1b1133;
}

.signal-icon{
  position:absolute;
  left:50%;
  top:-23px;
  transform:translateX(-50%);
  color:var(--purple);
  filter:drop-shadow(0 0 10px var(--purple));
  opacity:.95;
}

.signal-icon svg{
  width:25px;
  height:25px;
  stroke:currentColor;
  stroke-width:2;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.planet-name{
  margin-top:10px;
  font-size:15px;
  font-weight:900;
  letter-spacing:-.04em;
  text-shadow:0 2px 12px rgba(0,0,0,.85);
  white-space:nowrap;
}

.planet-time{
  margin-top:2px;
  color:rgba(255,255,255,.52);
  font-size:13px;
  font-weight:750;
  white-space:nowrap;
}

.legend{
  position:absolute;
  left:18px;
  bottom:28px;
  width:132px;
  padding:13px 12px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(8,11,25,.55);
  backdrop-filter:blur(18px);
  border-radius:18px;
  z-index:4;
  box-shadow:0 0 24px rgba(0,0,0,.25);
}

.legend-row{
  display:flex;
  align-items:center;
  gap:9px;
  color:rgba(255,255,255,.66);
  font-size:11.5px;
  font-weight:850;
  margin:0 0 11px;
  white-space:nowrap;
}

.legend-row:last-child{
  margin-bottom:0;
}

.legend-mark{
  width:11px;
  height:11px;
  border-radius:50%;
  background:var(--m);
  box-shadow:0 0 10px var(--m);
  flex:0 0 auto;
}

.legend-mark.num{
  width:16px;
  height:16px;
  display:grid;
  place-items:center;
  color:#1b1133;
  font-size:9px;
  font-weight:950;
}

.float-actions{
  position:absolute;
  right:20px;
  bottom:40px;
  z-index:4;
  display:flex;
  gap:14px;
}

.float-btn{
  width:52px;
  height:52px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.11);
  background:rgba(18,18,38,.62);
  backdrop-filter:blur(18px);
  display:grid;
  place-items:center;
  box-shadow:
    0 0 24px rgba(166,108,255,.12),
    inset 0 0 18px rgba(166,108,255,.07);
}

.float-btn svg{
  width:26px;
  height:26px;
  stroke:rgba(255,255,255,.9);
  stroke-width:2;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.bottom-nav{
  position:absolute;
  z-index:8;
  left:0;
  right:0;
  bottom:0;
  height:94px;
  padding:10px 17px max(10px,env(safe-area-inset-bottom));
  border-top:1px solid rgba(255,255,255,.1);
  background:rgba(2,5,12,.62);
  backdrop-filter:blur(22px);
}

.bottom-nav-inner{
  height:58px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:999px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  align-items:center;
  overflow:hidden;
  background:rgba(0,0,0,.12);
}

.nav-item{
  height:58px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:2px;
  color:rgba(255,255,255,.44);
  font-size:10px;
  font-weight:800;
  position:relative;
}

.nav-item.active{
  color:#f1e8ff;
  text-shadow:0 0 12px rgba(166,108,255,.5);
}

.nav-item.active::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:999px;
  background:radial-gradient(circle at 50% 50%, rgba(166,108,255,.26), transparent 58%);
}

.nav-item svg{
  width:23px;
  height:23px;
  stroke:currentColor;
  stroke-width:2;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.story-actions{
  position:absolute;
  z-index:12;
  left:20px;
  right:20px;
  bottom:52px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  pointer-events:none;
}

.story-action-pill{
  height:45px;
  display:grid;
  place-items:center;
  border-radius:999px;
  background:rgba(2,5,12,.45);
  border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(16px);
  font-size:18px;
  font-weight:950;
  letter-spacing:-.04em;
  text-shadow:0 0 16px rgba(255,255,255,.25);
}

.home-indicator{
  position:absolute;
  z-index:20;
  left:50%;
  bottom:8px;
  transform:translateX(-50%);
  width:154px;
  height:5px;
  border-radius:99px;
  background:white;
  box-shadow:0 -11px 0 white;
}

/* story viewer */
.story-viewer{
  position:absolute;
  inset:0;
  z-index:30;
  display:none;
  background:
    radial-gradient(circle at 50% 36%, rgba(166,108,255,.34), transparent 34%),
    radial-gradient(circle at 50% 52%, rgba(255,190,154,.18), transparent 28%),
    rgba(1,3,10,.92);
  backdrop-filter:blur(18px);
}

.story-viewer.show{
  display:block;
}

.story-progress{
  position:absolute;
  left:18px;
  right:18px;
  top:18px;
  display:flex;
  gap:5px;
  z-index:3;
}

.progress-seg{
  height:3px;
  flex:1;
  border-radius:99px;
  background:rgba(255,255,255,.22);
  overflow:hidden;
}

.progress-seg span{
  display:block;
  height:100%;
  width:0%;
  background:white;
  border-radius:inherit;
  box-shadow:0 0 12px rgba(255,255,255,.7);
}

.progress-seg.done span,
.progress-seg.active span{
  width:100%;
}

.story-top{
  position:absolute;
  top:34px;
  left:18px;
  right:18px;
  z-index:4;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.story-user{
  display:flex;
  align-items:center;
  gap:10px;
}

.story-avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 30%, #6be7ff, transparent 24%),
    radial-gradient(circle at 65% 70%, #164a86, #06152e 68%);
  box-shadow:0 0 18px rgba(120,217,255,.4);
}

.story-user-name{
  font-size:13px;
  font-weight:900;
}

.story-user-time{
  font-size:11px;
  font-weight:700;
  color:rgba(255,255,255,.52);
}

.close-story{
  width:38px;
  height:38px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
}

.close-story svg{
  width:21px;
  height:21px;
  stroke:white;
  stroke-width:2.5;
}

.story-content{
  position:absolute;
  inset:88px 18px 96px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.story-cover{
  width:230px;
  height:230px;
  border-radius:34px;
  background:var(--story-cover);
  box-shadow:
    0 0 50px var(--story-glow),
    inset -38px -42px 48px rgba(0,0,0,.45);
  border:1px solid rgba(255,255,255,.16);
  position:relative;
  overflow:hidden;
}

.story-cover::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 28% 24%, rgba(255,255,255,.65) 0 1px, transparent 2px),
    radial-gradient(circle at 72% 40%, rgba(255,255,255,.35) 0 1px, transparent 2px),
    linear-gradient(135deg, rgba(255,255,255,.18), transparent 30%);
}

.story-title{
  margin:24px 0 0;
  font-size:25px;
  font-weight:950;
  letter-spacing:-.06em;
}

.story-artist{
  margin:5px 0 0;
  color:rgba(255,255,255,.58);
  font-size:14px;
  font-weight:800;
}

.story-text{
  margin:18px 0 0;
  max-width:320px;
  color:rgba(255,255,255,.78);
  font-size:14px;
  line-height:1.7;
  font-weight:650;
}

.meters{
  width:100%;
  margin-top:22px;
  display:grid;
  gap:12px;
}

.meter{
  display:grid;
  grid-template-columns:74px 1fr 24px;
  gap:10px;
  align-items:center;
  text-align:left;
}

.meter-label{
  color:rgba(255,255,255,.7);
  font-size:12px;
  font-weight:850;
}

.meter-line{
  height:5px;
  border-radius:99px;
  background:rgba(255,255,255,.16);
  position:relative;
}

.meter-fill{
  height:100%;
  width:calc(var(--v) * 20%);
  border-radius:inherit;
  background:linear-gradient(90deg,var(--purple),var(--purple2));
  box-shadow:0 0 12px rgba(166,108,255,.65);
}

.meter-dot{
  position:absolute;
  top:50%;
  left:calc(var(--v) * 20%);
  transform:translate(-50%,-50%);
  width:12px;
  height:12px;
  border-radius:50%;
  background:var(--purple2);
  box-shadow:0 0 16px var(--purple);
}

.meter-score{
  font-size:12px;
  font-weight:900;
  color:rgba(255,255,255,.68);
}

.story-bottom{
  position:absolute;
  left:18px;
  right:18px;
  bottom:30px;
  display:grid;
  grid-template-columns:1fr auto auto auto;
  gap:10px;
  align-items:center;
}

.reply-box{
  height:42px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.06);
  color:rgba(255,255,255,.55);
  display:flex;
  align-items:center;
  padding:0 15px;
  font-size:13px;
  font-weight:800;
}

.story-mini-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.06);
}

.story-mini-btn svg{
  width:21px;
  height:21px;
  stroke:white;
  stroke-width:2;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.tap-zone{
  position:absolute;
  top:86px;
  bottom:88px;
  width:50%;
  z-index:2;
}

.tap-zone.left{left:0;}
.tap-zone.right{right:0;}

@media (max-width:380px){
  .title{font-size:23px;}
  .tab{font-size:13px;}
  .story-planet{transform:translate(-50%,-50%) scale(.94);}
  .legend{transform:scale(.92); transform-origin:left bottom;}
}
</style>
</head>

<body>
<div class="app-shell">

  <div class="statusbar">
    <div>9:41</div>
    <div class="status-icons">
      <span>▮▮▮</span>
      <span>⌁</span>
      <span style="border:1px solid white;border-radius:4px;padding:0 3px;font-size:11px;">100</span>
    </div>
  </div>

  <header class="header">
    <div class="header-row">
      <h1 class="title">Album Collection</h1>

      <div class="header-actions">
        <button class="icon-btn" aria-label="通知">
          <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
        </button>
        <button class="profile-planet" aria-label="プロフィール"></button>
      </div>
    </div>

    <nav class="tabs">
      <button class="tab">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M4 20 20 4"/></svg>
        天の川
      </button>
      <button class="tab active">
        <svg viewBox="0 0 24 24"><path d="M12 20v-8"/><path d="M8 20h8"/><path d="M12 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/><path d="M7 9a5 5 0 0 1 10 0"/><path d="M4 9a8 8 0 0 1 16 0"/></svg>
        観測
      </button>
      <button class="tab">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>

      <button class="tab">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.8-4 5-6 8-6s6.2 2 8 6"/></svg>

      </button>
    </nav>
  </header>

  <main class="main">
    <div class="section-head">
      <div>
        <h2 class="section-title">観測中の惑星たち</h2>
        <p class="section-sub">フォロー中の新しい信号を観測できます</p>
      </div>

      <button class="new-signal-btn" id="openNewest">

        <svg viewBox="0 0 24 24"><path d="M5 12h12"/><path d="m13 6 6 6-6 6"/></svg>
      </button>
    </div>

    <section class="galaxy-map" id="galaxyMap">
      <div class="orbit one"></div>
      <div class="orbit two"></div>
      <div class="orbit three"></div>
    </section>

    <div class="legend">
      <div class="legend-row"><span class="legend-mark" style="--m:var(--purple);"></span>新しい信号あり</div>
      <div class="legend-row"><span class="legend-mark" style="--m:var(--cyan);"></span>24時間以内の信号</div>
      <div class="legend-row"><span class="legend-mark" style="--m:var(--old);"></span>1日以上前の信号</div>
      <div class="legend-row"><span class="legend-mark num" style="--m:var(--purple);">2</span>複数の新しい信号</div>
    </div>

    <div class="float-actions">
      <button class="float-btn" aria-label="現在地">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v4"/><path d="M12 18v4"/><path d="M2 12h4"/><path d="M18 12h4"/></svg>
      </button>
      <button class="float-btn" aria-label="フィルター">
        <svg viewBox="0 0 24 24"><path d="M3 5h18l-7 8v5l-4 2v-7L3 5Z"/></svg>

    </div>

  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <button class="nav-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M4 20 20 4"/></svg>

      </button>
      <button class="nav-item active">
        <svg viewBox="0 0 24 24"><path d="M12 20v-8"/><path d="M8 20h8"/><path d="M12 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/><path d="M7 9a5 5 0 0 1 10 0"/><path d="M4 9a8 8 0 0 1 16 0"/></svg>
        観測

        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>

      </button>
      <button class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M12 20v-8"/><path d="M8 20h8"/><path d="M12 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/></svg>
        発信
      </button>
      <button class="nav-item">
        <span class="profile-planet" style="width:25px;height:25px;"></span>
        マイページ

  <div class="story-actions">
    <div class="story-action-pill">編集する</div>
    <div class="story-action-pill">共有する</div>

  <div class="home-indicator"></div>

  <section class="story-viewer" id="storyViewer">
    <div class="story-progress" id="storyProgress"></div>

    <div class="story-top">
      <div class="story-user">
        <div class="story-avatar"></div>
        <div>
          <div class="story-user-name" id="storyUser">KIRINJI</div>
          <div class="story-user-time" id="storyTime">2時間前</div>
        </div>
      </div>

      <button class="close-story" id="closeStory" aria-label="閉じる">
        <svg viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>

    <button class="tap-zone left" id="prevStory" aria-label="前へ"></button>
    <button class="tap-zone right" id="nextStory" aria-label="次へ"></button>

    <div class="story-content">
      <div class="story-cover" id="storyCover"></div>
      <h2 class="story-title" id="storyTitle">猫達の夕べ</h2>
      <p class="story-artist" id="storyArtist">KIRINJI</p>
      <p class="story-text" id="storyText">夜の散歩みたいに静かだけど、奥の方でちゃんと熱がある。音の余白がかなり好き。</p>

      <div class="meters" id="storyMeters"></div>
    </div>

    <div class="story-bottom">
      <div class="reply-box">コメントする</div>
      <button class="story-mini-btn" aria-label="いいね">
        <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>
      </button>
      <button class="story-mini-btn" aria-label="共有">
        <svg viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/></svg>
      </button>
      <button class="story-mini-btn" aria-label="詳細">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
      </button>
    </div>
  </section>

</div>

<script>
const signals = [
  {
    user:"KIRINJI",
    time:"2時間前",
    title:"猫達の夕べ",
    artist:"KIRINJI",
    text:"夜の散歩みたいに静かだけど、奥の方でちゃんと熱がある。音の余白がかなり好き。",
    x:"48%",
    y:"29%",
    size:"74px",
    status:"multiple",
    count:2,
    color:"purple",
    cover:"radial-gradient(circle at 36% 28%, #b680ff, transparent 20%), radial-gradient(circle at 65% 66%, #170a2e, #090613 68%)",
    metrics:{熱量:4, 余白:5, 個人世界:5}
  },
  {
    user:"betcover!!",
    time:"1時間前",
    title:"超人",
    artist:"betcover!!",
    text:"荒さと美しさが同居している感じ。少し怖いけど目が離せない。",
    x:"20%",
    y:"42%",
    size:"72px",
    status:"new",
    color:"red",
    cover:"radial-gradient(circle at 30% 35%, #ff775f, transparent 22%), radial-gradient(circle at 60% 62%, #3d0d08, #090306 70%)",
    metrics:{熱量:5, 中毒性:4, 個人世界:4}
  },
  {
    user:"睡眠船",
    time:"3時間前",
    title:"深海通信",
    artist:"睡眠船",
    text:"眠る直前に聴くと一番よさそう。青く沈んでいく感じがある。",
    x:"84%",
    y:"43%",
    size:"70px",
    status:"multiple",
    count:2,
    color:"cyan",
    cover:"radial-gradient(circle at 35% 30%, #74f1ff, transparent 22%), radial-gradient(circle at 68% 72%, #073b4d, #03141d 70%)",
    metrics:{浮遊感:5, 透明感:4, 個人世界:4}
  },
  {
    user:"自由ヶ丘",
    time:"23時間前",
    title:"駅前の夜",
    artist:"自由ヶ丘",
    text:"派手ではないけど、日記みたいに残っていくタイプの曲。",
    x:"20%",
    y:"61%",
    size:"64px",
    status:"old",
    color:"blue",
    cover:"radial-gradient(circle at 32% 30%, #5ba6ff, transparent 22%), radial-gradient(circle at 62% 70%, #102d5d, #050a18 70%)",
    metrics:{日常感:5, 余韻:4, 個人世界:3}
  },
  {
    user:"自分の惑星",
    time:"地球",
    title:"自分の記録",
    artist:"Album Collection",
    text:"自分が発信した音楽ログをここから確認できます。",
    x:"51%",
    y:"59%",
    size:"86px",
    status:"broadcast",
    color:"earth",
    cover:"radial-gradient(circle at 36% 28%, #6ebdff, transparent 22%), radial-gradient(circle at 64% 70%, #11396d, #06142a 72%)",
    metrics:{記録:5, 解釈:5, 個人世界:5}
  },
  {
    user:"ミツメ",
    time:"5時間前",
    title:"エスパー",
    artist:"ミツメ",
    text:"軽さの中に少しだけ寂しさがある。ずっと流していたい。",
    x:"78%",
    y:"68%",
    size:"68px",
    status:"new",
    color:"orange",
    cover:"radial-gradient(circle at 32% 32%, #ffc16d, transparent 24%), radial-gradient(circle at 66% 72%, #5d3512, #110804 70%)",
    metrics:{軽さ:4, 余韻:4, 個人世界:3}
  },
  {
    user:"yonawo",
    time:"12時間前",
    title:"rendez-vous",
    artist:"yonawo",
    text:"夜に溶ける感じ。声と音が近くて、空気ごと曲になっている。",
    x:"51%",
    y:"81%",
    size:"68px",
    status:"old",
    color:"violet",
    cover:"radial-gradient(circle at 34% 31%, #a65cff, transparent 24%), radial-gradient(circle at 68% 72%, #190b38, #05030d 72%)",
    metrics:{夜感:5, 透明感:4, 個人世界:4}
  }
];

const colorMap = {
  purple:{
    bg:"radial-gradient(circle at 34% 26%, #bc79ff, transparent 19%), radial-gradient(circle at 62% 62%, #321256, #080616 70%)",
    glow:"rgba(166,108,255,.88)",
    dot:"var(--purple)"
  },
  red:{
    bg:"radial-gradient(circle at 34% 30%, #ff624f, transparent 20%), radial-gradient(circle at 63% 64%, #511105, #090305 70%)",
    glow:"rgba(255,100,76,.7)",
    dot:"var(--purple)"
  },
  cyan:{
    bg:"radial-gradient(circle at 34% 30%, #73f2ff, transparent 22%), radial-gradient(circle at 63% 66%, #0a5060, #03151e 70%)",
    glow:"rgba(120,217,255,.7)",
    dot:"var(--purple)"
  },
  blue:{
    bg:"radial-gradient(circle at 34% 30%, #609cff, transparent 22%), radial-gradient(circle at 64% 66%, #132a5b, #050a18 70%)",
    glow:"rgba(89,145,255,.45)",
    dot:"var(--old)"
  },
  earth:{
    bg:"radial-gradient(circle at 32% 28%, #74c7ff, transparent 20%), radial-gradient(circle at 44% 50%, #2a854d, transparent 18%), radial-gradient(circle at 62% 66%, #0f3769, #061227 70%)",
    glow:"rgba(105,180,255,.78)",
    dot:"var(--purple)"
  },
  orange:{
    bg:"radial-gradient(circle at 34% 28%, #ffc06b, transparent 22%), radial-gradient(circle at 63% 66%, #5b3614, #100802 70%)",
    glow:"rgba(255,190,107,.6)",
    dot:"var(--purple)"
  },
  violet:{
    bg:"radial-gradient(circle at 32% 28%, #a85cff, transparent 22%), radial-gradient(circle at 62% 66%, #1e0d3c, #05030d 70%)",
    glow:"rgba(166,108,255,.55)",
    dot:"var(--old)"
  }
};

let currentStory = 0;

const galaxyMap = document.getElementById("galaxyMap");
const storyViewer = document.getElementById("storyViewer");
const storyProgress = document.getElementById("storyProgress");

function antennaIcon(){
  return `
    <svg viewBox="0 0 24 24">
      <path d="M12 20v-8"/>
      <path d="M8 20h8"/>
      <path d="M12 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/>
      <path d="M7 9a5 5 0 0 1 10 0"/>
      <path d="M4 9a8 8 0 0 1 16 0"/>
    </svg>
  `;
}

function renderGalaxy(){
  signals.forEach((item,index)=>{
    const c = colorMap[item.color];

    const planet = document.createElement("article");
    planet.className = "story-planet";
    planet.style.setProperty("--x", item.x);
    planet.style.setProperty("--y", item.y);
    planet.style.setProperty("--size", item.size);
    planet.style.setProperty("--planet-bg", c.bg);
    planet.style.setProperty("--glow", c.glow);
    planet.style.setProperty("--dot", c.dot);

    let dot = "";
    if(item.status === "multiple"){
      dot = `<span class="signal-dot multiple">${item.count}</span>`;
    }else if(item.status === "new" || item.status === "old"){
      dot = `<span class="signal-dot"></span>`;
    }

    let icon = item.status === "broadcast" ? `<span class="signal-icon">${antennaIcon()}</span>` : "";

    planet.innerHTML = `
      <button class="planet-button" aria-label="${item.user}のストーリーを開く">
        ${icon}
        ${dot}
      </button>
      <div class="planet-name">${item.user}</div>
      <div class="planet-time">${item.time}</div>
    `;

    planet.querySelector("button").addEventListener("click",()=>{
      openStory(index);
    });

    galaxyMap.appendChild(planet);
  });
}

function renderProgress(){
  storyProgress.innerHTML = signals.map((_,i)=>{
    const cls = i < currentStory ? "done" : i === currentStory ? "active" : "";
    return `<div class="progress-seg ${cls}"><span></span></div>`;
  }).join("");
}

function renderMeters(metrics){
  const box = document.getElementById("storyMeters");
  box.innerHTML = Object.entries(metrics).map(([label,value])=>`
    <div class="meter" style="--v:${value};">
      <div class="meter-label">${label}</div>
      <div class="meter-line">
        <div class="meter-fill"></div>
        <div class="meter-dot"></div>
      </div>
      <div class="meter-score">${value}</div>
    </div>
  `).join("");
}

function openStory(index){
  currentStory = index;
  const item = signals[currentStory];

  document.getElementById("storyUser").textContent = item.user;
  document.getElementById("storyTime").textContent = item.time;
  document.getElementById("storyTitle").textContent = item.title;
  document.getElementById("storyArtist").textContent = item.artist;
  document.getElementById("storyText").textContent = item.text;

  const cover = document.getElementById("storyCover");
  cover.style.setProperty("--story-cover", item.cover);
  cover.style.setProperty("--story-glow", colorMap[item.color].glow);

  renderMeters(item.metrics);
  renderProgress();

  storyViewer.classList.add("show");
}

function closeStory(){
  storyViewer.classList.remove("show");
}

function nextStory(){
  currentStory = (currentStory + 1) % signals.length;
  openStory(currentStory);
}

function prevStory(){
  currentStory = (currentStory - 1 + signals.length) % signals.length;
  openStory(currentStory);
}

document.getElementById("closeStory").addEventListener("click", closeStory);
document.getElementById("nextStory").addEventListener("click", nextStory);
document.getElementById("prevStory").addEventListener("click", prevStory);
document.getElementById("openNewest").addEventListener("click",()=>openStory(0));

document.addEventListener("keydown",(e)=>{
  if(!storyViewer.classList.contains("show")) return;
  if(e.key === "Escape") closeStory();
  if(e.key === "ArrowRight") nextStory();
  if(e.key === "ArrowLeft") prevStory();
});

let touchStartX = 0;

storyViewer.addEventListener("touchstart",(e)=>{
  touchStartX = e.touches[0].clientX;
},{passive:true});

storyViewer.addEventListener("touchend",(e)=>{
  const diff = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(diff) < 45) return;
  if(diff < 0) nextStory();
  else prevStory();
},{passive:true});

renderGalaxy();
</script>
</body>
</html>
