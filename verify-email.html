<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Verification - Album Collection</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050505;
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    padding:40px;
    padding-left:280px;
    padding-bottom:120px;
}

.verify-box{
    max-width:460px;
    margin:80px auto;
    background:#0b0b0b;
    border:1px solid rgba(255,255,255,0.12);
    border-radius:18px;
    padding:32px;
}

h1{
    font-size:34px;
    margin-bottom:12px;
}

.description{
    color:#aaa;
    line-height:1.7;
    margin-bottom:24px;
    font-size:14px;
}

.spam-warning{
    background:rgba(255,184,77,0.12);
    border:1px solid rgba(255,184,77,0.65);
    color:#ffd28a;
    border-radius:14px;
    padding:14px 16px;
    margin:0 0 20px;
    line-height:1.7;
    font-size:14px;
    font-weight:700;
}

.spam-warning .small{
    display:block;
    margin-top:6px;
    color:#e8c98f;
    font-size:13px;
    font-weight:500;
}

.email-box{
    background:#111;
    border:1px solid rgba(255,255,255,0.12);
    border-radius:12px;
    padding:14px;
    color:#ddd;
    font-size:14px;
    margin-bottom:18px;
    word-break:break-all;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    background:#6fa8dc;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

button:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

.sub-btn{
    display:block;
    width:100%;
    text-align:center;
    padding:14px;
    margin-top:10px;
    background:#222;
    color:white;
    border-radius:10px;
    font-size:16px;
    text-decoration:none;
}

.message{
    margin-top:16px;
    color:#aaa;
    line-height:1.7;
    white-space:pre-wrap;
    font-size:14px;
}

.error{
    color:#ff8a8a;
}

.success{
    color:#9ed99e;
}

a{
    color:#6fa8dc;
    text-decoration:none;
}

/* ===== 共通PCサイドバー ===== */
.sidebar{
    position:fixed;
    top:0;
    left:0;
    width:240px;
    height:100vh;
    background:#0b0b0b;
    border-right:1px solid rgba(255,255,255,0.1);
    padding:30px 20px;
    overflow-y:auto;
    z-index:100;
}

.logo{
    font-size:28px;
    font-weight:700;
    margin-bottom:30px;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:14px 16px;
    margin-bottom:8px;
    border-radius:10px;
    font-size:15px;
}

.sidebar a:hover,
.sidebar a.active{
    background:#1a1a1a;
}

.sidebar a.active{
    color:#6fa8dc;
}

/* ===== 共通スマホ下部タブバー ===== */
.mobile-tabbar{
    display:none;
}

.mobile-tabbar a{
    color:#999;
    text-decoration:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    font-size:11px;
    flex:1;
}

.mobile-tabbar a.active{
    color:white;
    font-weight:700;
}

.mobile-tabbar .icon{
    font-size:22px;
    line-height:1;
}

.mobile-tabbar .label{
    line-height:1;
    white-space:nowrap;
}

.mobile-tabbar .tab-avatar{
    width:28px;
    height:28px;
    border-radius:50%;
    object-fit:cover;
    background:#111;
    border:1px solid rgba(255,255,255,0.35);
    display:none;
}

.mobile-tabbar .mypage-icon-text{
    font-size:22px;
    line-height:1;
    height:24px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* ===== 共通右下投稿ボタン ===== */
.fab{
    position:fixed;
    right:24px;
    bottom:24px;
    width:64px;
    height:64px;
    border-radius:50%;
    background:#6fa8dc;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    text-decoration:none;
    box-shadow:0 8px 24px rgba(0,0,0,0.45);
    z-index:1000;
}

.fab:hover{
    background:#84b7e4;
}

@media(max-width:900px){
    body{
        padding-left:16px !important;
        padding-right:16px !important;
        padding-bottom:110px !important;
    }

    .sidebar{
        display:none;
    }

    .mobile-tabbar{
        display:flex;
        position:fixed;
        left:0;
        right:0;
        bottom:0;
        height:72px;
        background:#0b0b0b;
        border-top:1px solid rgba(255,255,255,0.1);
        z-index:999;
        padding-bottom:env(safe-area-inset-bottom);
    }

    .fab{
        right:16px;
        bottom:88px;
        width:58px;
        height:58px;
        font-size:32px;
    }

    .verify-box{
        margin:32px auto;
        padding:26px;
    }

    h1{
        font-size:30px;
    }
}
</style>
</head>

<body>

<!-- PC用サイドバー -->
<nav class="sidebar">
    <div class="logo">Album Collection</div>

    <a href="index.html">ホーム</a>
    <a href="search.html">検索</a>
    <a href="editor.html">投稿する</a>
    <a href="notifications.html">通知</a>
    <a id="myPageLink" href="login.html">マイページ</a>
    <a href="profile-edit.html">プロフィール編集</a>
    <a href="login.html">ログイン</a>
</nav>

<!-- スマホ用下部タブバー -->
<nav class="mobile-tabbar">
    <a href="index.html">
        <span class="icon">⌂</span>
        <span class="label">ホーム</span>
    </a>

    <a href="search.html">
        <span class="icon">⌕</span>
        <span class="label">検索</span>
    </a>

    <a href="editor.html">
        <span class="icon">＋</span>
        <span class="label">投稿</span>
    </a>

    <a href="notifications.html">
        <span class="icon">♡</span>
        <span class="label">通知</span>
    </a>

    <a id="mobileMyPageLink" href="login.html">
        <img id="mobileMyPageAvatar" class="tab-avatar" src="" alt="">
        <span id="mobileMyPageFallback" class="mypage-icon-text">◯</span>
        <span class="label">マイページ</span>
    </a>
</nav>

<a href="editor.html" class="fab">＋</a>

<div class="verify-box">
    <h1>メール確認</h1>

    <div class="description">
        登録したメールアドレス宛に確認メールを送信しました。<br>
        メール内のリンクを開いたあと、この画面に戻って「確認しました」を押してください。
    </div>

    <div class="spam-warning">
        ⚠️ 確認メールはほぼ確実に迷惑メールに入っています
        <span class="small">
            Gmailの「迷惑メール」「プロモーション」「すべてのメール」を確認してください。<br>
            メール内のURLがリンク化されていない場合は、URLをコピーしてブラウザに貼り付けて開いてください。
        </span>
    </div>

    <div class="email-box" id="emailBox">
        ログイン情報を確認中…
    </div>

    <button id="checkedBtn">確認しました</button>
    <button id="resendBtn">確認メールを再送する</button>

    <a class="sub-btn" href="login.html">ログイン画面へ</a>

    <div class="message" id="message"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    sendEmailVerification,
    signOut
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
    initializeFirestore,
    doc,
    setDoc,
    getDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyBfXg4W8MLV6sL1I-g1OOv-6znxJztL1Yc",
    authDomain: "album-49b3e.firebaseapp.com",
    projectId: "album-49b3e",
    storageBucket: "album-49b3e.firebasestorage.app",
    messagingSenderId: "448724897117",
    appId: "1:448724897117:web:e124ab546bc69aeea7ecb4",
    measurementId: "G-3QFX3GDEXN"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
auth.languageCode = "ja";

const db = initializeFirestore(app, {
    experimentalAutoDetectLongPolling: true
});

const emailBox = document.getElementById("emailBox");
const checkedBtn = document.getElementById("checkedBtn");
const resendBtn = document.getElementById("resendBtn");
const message = document.getElementById("message");
const myPageLink = document.getElementById("myPageLink");
const mobileMyPageLink = document.getElementById("mobileMyPageLink");
const mobileMyPageAvatar = document.getElementById("mobileMyPageAvatar");
const mobileMyPageFallback = document.getElementById("mobileMyPageFallback");

const params = new URLSearchParams(location.search);
const redirect = params.get("redirect") || "profile-edit.html";

let currentUser = null;

function setMessage(text, type = ""){
    message.textContent = text;
    message.className = "message";

    if(type){
        message.classList.add(type);
    }
}


function getUserIconUrl(data){
    return (
        data?.photoURL ||
        data?.iconURL ||
        data?.iconUrl ||
        data?.avatar ||
        data?.avatarUrl ||
        data?.profileImage ||
        data?.profileImageUrl ||
        data?.imageUrl ||
        data?.icon ||
        ""
    );
}

async function updateMobileMyPageTab(user){
    if(!mobileMyPageLink){
        return;
    }

    if(!user){
        mobileMyPageLink.href = "login.html";

        if(mobileMyPageAvatar){
            mobileMyPageAvatar.style.display = "none";
            mobileMyPageAvatar.src = "";
        }

        if(mobileMyPageFallback){
            mobileMyPageFallback.style.display = "flex";
        }

        return;
    }

    mobileMyPageLink.href = `profile.html?uid=${encodeURIComponent(user.uid)}`;

    try{
        const userSnap = await getDoc(doc(db, "publicUsers", user.uid));

        if(!userSnap.exists()){
            return;
        }

        const iconUrl = getUserIconUrl(userSnap.data());

        if(iconUrl && mobileMyPageAvatar && mobileMyPageFallback){
            mobileMyPageAvatar.src = iconUrl;
            mobileMyPageAvatar.style.display = "block";
            mobileMyPageFallback.style.display = "none";

            mobileMyPageAvatar.onerror = () => {
                mobileMyPageAvatar.style.display = "none";
                mobileMyPageFallback.style.display = "flex";
            };
        }
    }catch(error){
        console.warn("マイページアイコンの取得に失敗しました", error);
    }
}

function updateCommonMyPageLinks(user){
    const url = user ? `profile.html?uid=${encodeURIComponent(user.uid)}` : "login.html";

    myPageLink.href = url;
    mobileMyPageLink.href = url;
    updateMobileMyPageTab(user);
}

async function updateEmailVerifiedFlag(user){
    await setDoc(doc(db, "users", user.uid), {
        email: user.email,
        emailVerified: user.emailVerified,
        updatedAt: serverTimestamp()
    }, { merge: true });
}

onAuthStateChanged(auth, async (user) => {
    updateCommonMyPageLinks(user);

    if(!user){
        currentUser = null;
        emailBox.textContent = "ログインしていません。ログイン画面からログインしてください。";
        checkedBtn.disabled = true;
        resendBtn.disabled = true;
        setMessage("メール確認にはログインが必要です。", "error");
        return;
    }

    currentUser = user;
    emailBox.textContent = `確認対象：${user.email}`;

    if(user.emailVerified){
        try{
            await updateEmailVerifiedFlag(user);
        }catch(error){
            console.warn(error);
        }

        setMessage("メール確認はすでに完了しています。移動します。", "success");

        setTimeout(() => {
            location.href = redirect;
        }, 900);

        return;
    }

    setMessage("メールを確認してください。確認メールはほぼ確実に迷惑メールに入っています。URLがリンク化されていない場合は、コピーしてブラウザに貼り付けて開いてください。");
});

checkedBtn.addEventListener("click", async () => {
    if(!currentUser){
        setMessage("ログインしていません。", "error");
        return;
    }

    checkedBtn.disabled = true;
    setMessage("確認状態をチェックしています…");

    try{
        await currentUser.reload();

        currentUser = auth.currentUser;

        if(currentUser.emailVerified){
            await updateEmailVerifiedFlag(currentUser);

            setMessage("メール確認が完了しました。プロフィール編集へ移動します。", "success");

            setTimeout(() => {
                location.href = redirect;
            }, 900);
        }else{
            setMessage("まだメール確認が完了していません。\nメール内のリンクを開いてから、もう一度押してください。", "error");
            checkedBtn.disabled = false;
        }

    }catch(error){
        console.error(error);
        setMessage("確認状態の取得に失敗しました：" + error.message, "error");
        checkedBtn.disabled = false;
    }
});

resendBtn.addEventListener("click", async () => {
    if(!currentUser){
        setMessage("ログインしていません。", "error");
        return;
    }

    resendBtn.disabled = true;
    setMessage("確認メールを再送しています…");

    try{
        await sendEmailVerification(currentUser);
        setMessage("確認メールを再送しました。\nメール内のリンクを開いてから「確認しました」を押してください。", "success");
    }catch(error){
        console.error(error);

        let text = "確認メールの再送に失敗しました：" + error.message;

        if(error.code === "auth/too-many-requests"){
            text = "短時間に何度も送信されています。少し時間を置いてから再送してください。";
        }

        setMessage(text, "error");
    }finally{
        setTimeout(() => {
            resendBtn.disabled = false;
        }, 5000);
    }
});
</script>

</body>
</html>
